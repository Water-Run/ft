<!doctype html>
<!-- 根 README 的动图。画面是时间 t 的纯函数：只由 window.seek(t) 决定，没有 CSS 动画、定时器与随机数。
     重新生成：node kit/tools/gif.js docs/media/ft.html（输出 docs/media/ft.gif）。
     瑞士风格：一种蓝，网格，大字，细线，没有光晕与装饰；大字与小字按墨迹对齐同一左缘，中文一行与 f(t) 同一基线。
     左边是 f(t)。t 的竖线落到下方的时间轴上；时间轴匀速流过，竖线左边的曲线已经算出（实心），右边尚未算出（细线）。
     轴上的标记经过竖线时，右边换成这一段的内容：时间的函数、自由软件、自由视频、GPL、人人共享、各尽所能。
     时间轴的长度正好是一个周期 T，t = T 的画面就是 t = 0 的画面。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>f(t)</title>
<style>
  @font-face { font-family: "Sans SC"; src: url("/fonts/NotoSansSC.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("/fonts/Inter.ttf"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 540px; overflow: hidden; background: #081d4b; }
  svg { position: absolute; left: 0; top: 0; }
  text { font-family: "Inter", "Sans SC", sans-serif; }
</style>
</head>
<body>
<svg id="art" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <linearGradient id="gEdge" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="0.07" stop-color="#fff"/><stop offset="0.93" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="mEdge" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="540">
      <rect x="0" y="0" width="1200" height="540" fill="url(#gEdge)"/>
    </mask>
  </defs>
</svg>
<script>
window.GIF = { width: 1200, height: 540, fps: 25, dur: 21, scale: 1 };
const T = 21, V = 100;            // 时间轴每秒流过 100 像素：25 帧/秒时每帧正好 4 像素
const W = 1200, M = 60;
const BLUE = '#2f8fff', WHITE = '#eef6ff', DIM = '#8fb4e6', FAINT = '#2c4a7c';

// 六段，总长正好是 T。第一帧落在第一段里，标题已经站定。
const CH = [
  { dur: 4.0,  head: '时间的函数', en: 'EVERY FRAME IS A FUNCTION OF TIME', zh: '同一个 t，永远算出同一帧', tag: '函数' },
  { dur: 3.75, head: '自由软件', en: 'FREE SOFTWARE', zh: '运行 · 研究 · 修改 · 分发', tag: '自由软件' },
  { dur: 3.5,  head: '自由视频', en: 'FREE VIDEO', zh: '事实、文案与源码随片公开', tag: '自由视频' },
  { dur: 3.5,  head: 'GPL-3.0', en: 'OR ANY LATER VERSION', zh: '改编之后再发布，同样附上源码', tag: 'GPL' },
  { dur: 3.25, head: '人人共享', en: 'OPEN SOURCE, FOR EVERYONE', zh: '拿去看，拿去改，拿去重做一部', tag: '人人共享' },
  { dur: 3.0,  head: '各尽所能', en: 'FROM EACH ACCORDING TO ABILITY', zh: '以共产主义精神共享知识', tag: '各尽所能' },
];
const C0 = -1.0;                  // 第一段在 t = -1 开始
let acc = 0;
for (const c of CH) { c.off = acc; acc += c.dur; }

// 版面
const FT = { size: 270, base: 267 };          // f(t)：字面顶端落在上边距 60 上
const RX = 612;                                // 右栏左缘（12 栏网格的第 7 栏）
const R = { rule: 60, idx: 86, head: 189, en: 231, zh: 267 };   // 细线与 f(t) 顶端齐平，中文一行与 f(t) 同一基线
const AY = 452;                                // 时间轴
const curveY = (v) => AY - 46 - 32 * v;        // 曲线在轴上方 [AY-78, AY-14]
const ROLL = 104;                              // 标题滚动的距离

const NS = 'http://www.w3.org/2000/svg', art = document.getElementById('art');
const el = (tag, attrs = {}, parent = art) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mod = (x, m) => ((x % m) + m) % m;
const f1 = (x) => Math.round(x * 10) / 10;

// 曲线：每段一个完整的余弦周期，峰值正好落在段首的标记上
function value(tau) {
  const u = mod(tau - C0, T);
  let k = CH.length - 1; while (CH[k].off > u) k--;
  return Math.cos(2 * Math.PI * (k + (u - CH[k].off) / CH[k].dur));
}

let PX = 0;                       // 竖线的位置：t 的竖笔
const band = el('g', { mask: 'url(#mEdge)' });
const area = el('path', { fill: BLUE }, band);
const pastLine = el('path', { fill: 'none', stroke: WHITE, 'stroke-width': 2, 'stroke-linejoin': 'round' }, band);
const futureLine = el('path', { fill: 'none', stroke: DIM, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-opacity': 0.55 }, band);
el('line', { x1: 0, x2: W, y1: AY + 0.5, y2: AY + 0.5, stroke: FAINT, 'stroke-width': 1 }, band);
const ticks = el('path', { fill: 'none', stroke: FAINT, 'stroke-width': 1 }, band);
const marks = el('path', { fill: 'none', stroke: BLUE, 'stroke-width': 2 }, band);
const labels = CH.map((c, k) => {
  const g = el('g', {}, band);
  const t = el('text', { y: AY + 31, 'font-size': 15, 'font-weight': 500, fill: DIM }, g);
  el('tspan', { fill: BLUE, 'font-weight': 600 }, t).textContent = String(k + 1).padStart(2, '0');
  el('tspan', { dx: 8 }, t).textContent = c.tag;
  return g;
});
const playhead = el('line', { stroke: BLUE, 'stroke-width': 2 });
const dot = el('circle', { r: 6, fill: WHITE });

// f(t)
const ft = el('text', { x: M, y: FT.base, 'font-size': FT.size, 'font-weight': 700, fill: WHITE, 'letter-spacing': '-0.02em' });
ft.append('f(');
el('tspan', { fill: BLUE }, ft).textContent = 't';
ft.append(')');

// 右栏：编号、细线、标题、英文、中文
el('line', { x1: RX, x2: W - M, y1: R.rule + 0.5, y2: R.rule + 0.5, stroke: FAINT, 'stroke-width': 1 });
const gpl = el('text', { x: W - M, y: R.idx, 'font-size': 15, 'font-weight': 500, fill: DIM, 'text-anchor': 'end', 'letter-spacing': '0.04em' });
gpl.textContent = 'GPL-3.0-or-later';
const total = el('text', { y: R.idx, 'font-size': 15, 'font-weight': 500, fill: DIM }); total.textContent = '/ ' + String(CH.length).padStart(2, '0');

function clipRow(id, y0, y1) {
  const cp = el('clipPath', { id }, art.querySelector('defs'));
  el('rect', { x: RX - 20, y: y0, width: W - RX, height: y1 - y0 }, cp);
  return el('g', { 'clip-path': `url(#${id})` });
}
const rows = {
  idx: { g: clipRow('cIdx', R.idx - 16, R.idx + 6), y: R.idx, roll: 24, attrs: { 'font-size': 15, 'font-weight': 600, fill: BLUE }, perChar: true, delay: 0, dur: 0.6 },
  head: { g: clipRow('cHead', R.idx + 10, R.head + 12), y: R.head, roll: ROLL, attrs: { 'font-size': 80, 'font-weight': 600, fill: WHITE }, perChar: true, delay: 0, dur: 0.8 },
  en: { g: clipRow('cEn', R.en - 16, R.en + 6), y: R.en, roll: 24, attrs: { 'font-size': 15, 'font-weight': 600, fill: BLUE, 'letter-spacing': '0.14em' }, perChar: false, delay: 0.22, dur: 0.6 },
  zh: { g: clipRow('cZh', R.zh - 20, R.zh + 8), y: R.zh, roll: 30, attrs: { 'font-size': 20, 'font-weight': 400, fill: DIM, 'letter-spacing': '0.04em' }, perChar: false, delay: 0.3, dur: 0.6 },
};
const rowText = { idx: (c, k) => String(k + 1).padStart(2, '0'), head: (c) => c.head, en: (c) => c.en, zh: (c) => c.zh };

// 每段每行先排好字形；逐字滚动时，同一位置上相同的字不动
function layoutRows() {
  for (const name in rows) {
    const row = rows[name];
    row.glyphs = CH.map((c, k) => {
      const s = rowText[name](c, k), parts = row.perChar ? [...s] : [s];
      // 中文与大字按墨迹对齐左缘：字侧留白随字而变，不补偿就和英文小字差出几个像素
      let x = name === 'head' ? RX + 2 - inkLeft(parts[0], '600 80px Inter, "Sans SC"') : name === 'zh' ? RX + 1 - inkLeft(parts[0], '400 20px Inter, "Sans SC"') : RX;
      return parts.map((ch) => {
        const e = el('text', { ...row.attrs, x, y: row.y, visibility: 'hidden' }, row.g);
        e.textContent = ch;
        const w = e.getComputedTextLength();
        const g = { e, ch, x: f1(x) };
        x += w + (row.perChar && name === 'head' ? 80 * 0.01 : 0);
        return g;
      });
    });
  }
  const iw = rows.idx.glyphs[0].reduce((a, g) => a + g.e.getComputedTextLength(), 0);
  total.setAttribute('x', f1(RX + iw + 8));
}

// 字形墨迹左缘相对起笔点的距离：大字的字侧留白明显，不补偿就和下面的小字对不齐
function inkLeft(ch, font) {
  const c = document.createElement('canvas'); c.width = 200; c.height = 120;
  const g = c.getContext('2d');
  g.font = font; g.fillText(ch, 40, 100);
  const d = g.getImageData(0, 0, 200, 120).data;
  for (let x = 0; x < 200; x++) for (let y = 0; y < 120; y++) if (d[(y * 200 + x) * 4 + 3] > 96) return x - 40;
  return 0;
}

// t 的竖笔：在画布上画出 t，取十字横笔以下那一段墨迹的中心
function stemOffset() {
  const c = document.createElement('canvas'), s = FT.size;
  c.width = s; c.height = s * 1.2;
  const g = c.getContext('2d');
  g.font = `700 ${s}px Inter`; g.fillStyle = '#000'; g.fillText('t', 0, s);
  const y = Math.round(s - 0.22 * s), row = g.getImageData(0, y, c.width, 1).data;
  let a = -1, b = -1;
  for (let x = 0; x < c.width; x++) if (row[x * 4 + 3] > 128) { if (a < 0) a = x; b = x; }
  return (a + b + 1) / 2;
}

function draw(t) {
  const xs = (tau) => PX + Math.round((tau - t) * V * 100) / 100;
  // 曲线：沿时间轴每 0.04 秒取一点，取样点随轴整像素移动
  const step = 0.04, j0 = Math.ceil((t - PX / V) / step) - 1, j1 = Math.floor((t + (W - PX) / V) / step) + 1;
  const past = [], future = [];
  for (let j = j0; j <= j1; j++) {
    const tau = j * step, x = xs(tau);
    const p = `${f1(x)},${f1(curveY(value(tau)))}`;
    if (tau < t) past.push(p); else if (tau > t) future.push(p);
  }
  const now = `${PX},${f1(curveY(value(t)))}`;
  past.push(now); future.unshift(now);
  pastLine.setAttribute('d', 'M' + past.join('L'));
  futureLine.setAttribute('d', 'M' + future.join('L'));
  area.setAttribute('d', `M${past[0].split(',')[0]},${AY}L${past.join('L')}L${PX},${AY}Z`);
  dot.setAttribute('cx', PX); dot.setAttribute('cy', f1(curveY(value(t))));

  // 刻度：每 0.25 秒一短格，每秒一长格
  let d = '';
  for (let q = Math.ceil((t - PX / V) * 4); q <= Math.floor((t + (W - PX) / V) * 4); q++) {
    const x = Math.round(xs(q / 4)) + 0.5;
    d += `M${x},${AY}V${AY + (q % 4 === 0 ? 10 : 5)}`;
  }
  ticks.setAttribute('d', d);

  // 段首标记与标签：每个标记沿轴周期出现
  let md = '';
  CH.forEach((c, k) => {
    const base = C0 + c.off, n0 = Math.ceil((t - PX / V - base) / T) - 1;
    let shown = false;
    for (let n = n0; n <= n0 + 2; n++) {
      const x = Math.round(xs(base + n * T));
      if (x < -40 || x > W + 40) continue;
      md += `M${x},${AY}V${AY + 34}`;
      if (!shown) { labels[k].setAttribute('transform', `translate(${x + 10} 0)`); shown = true; }
    }
    labels[k].setAttribute('visibility', shown ? 'visible' : 'hidden');
  });
  marks.setAttribute('d', md);

  // 右栏：当前段与它的局部时间
  const u = mod(t - C0, T);
  let k = CH.length - 1; while (CH[k].off > u) k--;
  const p = (k + CH.length - 1) % CH.length, lu = u - CH[k].off;
  for (const name in rows) {
    const row = rows[name];
    row.glyphs.forEach((gs) => gs.forEach((g) => g.e.setAttribute('visibility', 'hidden')));
    const cur = row.glyphs[k], prev = row.glyphs[p], n = Math.max(cur.length, prev.length);
    for (let i = 0; i < n; i++) {
      const a = prev[i], b = cur[i];
      if (a && b && a.ch === b.ch && a.x === b.x) { b.e.setAttribute('y', row.y); b.e.setAttribute('visibility', 'visible'); continue; }
      // 旧字加速上出，到边的一刻新字从下面带着同样的速度进来、减速站定：
      // 运动不停，同一位置任何时刻只有一个字，也没有空白的间隙；大字逐字错开
      const x = (lu - row.delay - i * 0.04) / row.dur, eo = clamp(2 * x) ** 3, ei = 1 - (1 - clamp(2 * x - 1)) ** 3;
      if (a && eo < 1) { a.e.setAttribute('y', f1(row.y - eo * row.roll)); a.e.setAttribute('visibility', 'visible'); }
      if (b && ei > 0) { b.e.setAttribute('y', f1(row.y + (1 - ei) * row.roll)); b.e.setAttribute('visibility', 'visible'); }
    }
  }
}

window.READY = Promise.all([
  document.fonts.load('700 270px Inter'), document.fonts.load('600 80px Inter'), document.fonts.load('600 80px "Sans SC"'), document.fonts.load('400 20px "Sans SC"'),
]).then(() => {
  ft.setAttribute('x', M);
  const sx = ft.getStartPositionOfChar(2).x;
  PX = Math.round(sx + stemOffset());
  playhead.setAttribute('x1', PX); playhead.setAttribute('x2', PX);
  playhead.setAttribute('y1', FT.base + 22); playhead.setAttribute('y2', AY);
  layoutRows();
  draw(0);
});
window.seek = (t) => draw(mod(t, T));
</script>
</body>
</html>
