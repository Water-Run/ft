<!doctype html>
<!-- 根 README 的动图。画面是时间 t 的纯函数：只由 window.seek(t) 决定，没有 CSS 动画、定时器与随机数。
     重新生成：node kit/tools/gif.js docs/media/ft.html（输出 docs/media/ft.gif）。
     一切运动以 T 为周期（旋转、谐波、标注、复制、高亮），t = T 的画面就是 t = 0 的画面，循环播放没有接缝。
     四段对应自由软件的四项自由：运行（机器转动）、研究（标注尺寸）、修改（加入谐波、改写公式）、分发（波形复制出去）。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>f(t)</title>
<style>
  @font-face { font-family: "Sans SC"; src: url("/fonts/NotoSansSC.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Mono"; src: url("/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Inter"; src: url("/fonts/Inter.ttf"); font-weight: 100 900; }
  :root { --bg: #0d4185; --line: #eef5ff; --dim: #9fbde6; --accent: #67d4ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 540px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Sans SC", sans-serif; color: var(--line); }
  svg { position: absolute; left: 0; top: 0; }
  .abs { position: absolute; white-space: nowrap; will-change: transform; }
  #ft { left: 56px; top: 22px; font: 900 188px/1.25 "Inter"; letter-spacing: -0.03em; }
  #ft .t { color: var(--accent); }
  #title { left: 62px; top: 236px; font: 900 78px/1.2 "Sans SC"; letter-spacing: 0.04em; }
  #sub { left: 66px; top: 350px; font: 500 21px/1 "Sans SC"; color: var(--dim); letter-spacing: 0.06em; }
  .chip { position: absolute; top: 390px; width: 92px; height: 46px; border: 1.5px solid; border-radius: 3px; font: 700 23px/43px "Sans SC"; text-align: center; letter-spacing: 0.08em; }
  #gpl { left: 66px; top: 466px; display: flex; align-items: center; gap: 14px; }
  #gpl b { padding: 7px 12px; border: 1.5px solid var(--line); font: 700 18px/1 "Mono"; letter-spacing: 0.02em; }
  #gpl span { font: 500 17px/1 "Sans SC"; color: var(--dim); letter-spacing: 0.04em; }
  #fig { left: 640px; top: 40px; font: 500 14px/1 "Mono"; color: var(--dim); letter-spacing: 0.08em; }
  #formula { left: 640px; top: 478px; font: 500 16px/1 "Mono"; color: var(--line); }
  #formula .t { color: var(--accent); }
  #formula .add { color: var(--accent); }
  .note { position: absolute; font: italic 600 16px/1 "Mono"; color: var(--accent); white-space: nowrap; }
</style>
</head>
<body>
<svg id="art" width="1200" height="540" viewBox="0 0 1200 540"></svg>
<div class="abs" id="ft"><span>f(</span><span class="t">t</span><span>)</span></div>
<div class="abs" id="title">自由视频</div>
<div class="abs" id="sub">与自由软件一样，人人可以</div>
<div id="chips"></div>
<div class="abs" id="gpl"><b>GPL-3.0-or-later</b><span>源码、文案与工具全部公开</span></div>
<div class="abs" id="fig">FIG.1　frame = f(t)</div>
<div class="abs" id="formula"></div>
<div class="note" id="nA">A</div>
<div class="note" id="nT">T</div>
<div class="note" id="nW">ωt</div>
<script>
window.GIF = { width: 1200, height: 540, fps: 50, dur: 8, scale: 1.5 };
const T = 8, W = Math.PI;                          // 循环周期 8 秒；基频每 2 秒转一圈，一个循环正好四圈
const LINE = '#eef5ff', DIM = '#9fbde6', ACCENT = '#67d4ff', BG = '#0d4185';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mod = (a, n) => ((a % n) + n) % n;
const io3 = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const span = (s, a, d) => clamp((s - a) / d);
const bump = (s, a, b, r) => io3(span(s, a, r)) * (1 - io3(span(s, b - r, r)));   // [a, b] 内为 1，两端各用 r 秒渐变
const NS = 'http://www.w3.org/2000/svg';
const art = document.getElementById('art');
const el = (tag, attrs, parent = art) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };
const $ = (id) => document.getElementById(id);

// ── 图纸：网格与图框（静止） ──
for (let x = 0; x <= 1200; x += 24) el('line', { x1: x, x2: x, y1: 0, y2: 540, stroke: LINE, 'stroke-opacity': x % 120 ? 0.05 : 0.11 });
for (let y = 12; y <= 540; y += 24) el('line', { x1: 0, x2: 1200, y1: y, y2: y, stroke: LINE, 'stroke-opacity': (y - 12) % 120 ? 0.05 : 0.11 });
el('rect', { x: 16, y: 16, width: 1168, height: 508, fill: 'none', stroke: LINE, 'stroke-opacity': 0.45, 'stroke-width': 1.5 });
el('rect', { x: 22, y: 22, width: 1156, height: 496, fill: 'none', stroke: LINE, 'stroke-opacity': 0.2 });

// ── 右侧的机器：旋转矢量画出 f(t)，波形向右流出 ──
const CX = 730, CY = 245, R1 = 88, X0 = 880, X1 = 1130, V = 62.5;   // V：波形流速（像素/秒），一个周期 2 秒走 125 像素
// 修改段加入 3、5、7 次谐波（方波的前几项），分发段收回；m 以 T 为周期
const harm = (t) => { t = mod(t, T); return io3(span(t, 4.15, 0.8)) * (1 - io3(span(t, 7.1, 0.8))); };
const TERMS = [1, 3, 5, 7];
const f = (t) => { const th = W * t, m = harm(t); return TERMS.reduce((y, k) => y + (k === 1 ? 1 : m) / k * Math.sin(k * th), 0); };
el('line', { x1: CX - R1 - 30, x2: X1 + 10, y1: CY, y2: CY, stroke: DIM, 'stroke-opacity': 0.5, 'stroke-dasharray': '6 4' });
el('line', { x1: CX, x2: CX, y1: CY - R1 - 30, y2: CY + R1 + 30, stroke: DIM, 'stroke-opacity': 0.5, 'stroke-dasharray': '6 4' });
el('line', { x1: X0, x2: X0, y1: CY - R1 - 14, y2: CY + R1 + 14, stroke: DIM, 'stroke-opacity': 0.5 });
const rings = TERMS.map((k) => el('circle', { fill: 'none', stroke: k === 1 ? LINE : DIM, 'stroke-width': k === 1 ? 1.6 : 1.2, 'stroke-opacity': k === 1 ? 0.8 : 0.75 }));
const arcs = el('path', { fill: 'none', stroke: ACCENT, 'stroke-width': 1.5 });
const copies = [-1, 1].map(() => el('path', { fill: 'none', stroke: DIM, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
const fork = el('line', { stroke: DIM, 'stroke-width': 1.2, 'stroke-dasharray': '4 4' });
const copyHeads = [-1, 1].map(() => el('circle', { r: 4, fill: DIM }));
const wave = el('path', { fill: 'none', stroke: ACCENT, 'stroke-width': 3.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
const arms = el('path', { fill: 'none', stroke: LINE, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
const proj = el('line', { stroke: LINE, 'stroke-opacity': 0.6, 'stroke-width': 1.2, 'stroke-dasharray': '3 4' });
const tip = el('circle', { r: 6, fill: ACCENT, stroke: LINE, 'stroke-width': 2 });
const head = el('circle', { r: 4.5, fill: LINE });
// 研究段的尺寸标注
const dims = el('g', {});
const LAMBDA = 2 * V;
el('path', { d: `M${X0},${CY - R1 - 30}h${LAMBDA}M${X0},${CY - R1 - 36}v12M${X0 + LAMBDA},${CY - R1 - 36}v12`, stroke: ACCENT, 'stroke-width': 1.5, fill: 'none' }, dims);
el('path', { d: `M${X1 + 22},${CY}v${-R1}M${X1 + 16},${CY}h12M${X1 + 16},${CY - R1}h12`, stroke: ACCENT, 'stroke-width': 1.5, fill: 'none' }, dims);
const place = (id, x, y) => { const e = $(id); e.style.left = x + 'px'; e.style.top = y + 'px'; return e; };
place('nT', X0 + LAMBDA / 2 - 5, CY - R1 - 56);
place('nA', X1 + 30, CY - R1 / 2 - 8);

// ── 左侧：四项自由 ──
const FREEDOMS = ['运行', '研究', '修改', '分发'];
const chips = FREEDOMS.map((name, i) => { const c = document.createElement('div'); c.className = 'chip'; c.textContent = name; c.style.left = (66 + i * 104) + 'px'; $('chips').appendChild(c); return c; });
const mix = (a, b, k) => '#' + [0, 2, 4].map((i) => Math.round(lerp(parseInt(a.substr(1 + i, 2), 16), parseInt(b.substr(1 + i, 2), 16), k)).toString(16).padStart(2, '0')).join('');
const lerp = (a, b, k) => a + (b - a) * k;
const BASE = 'f(<span class="t">t</span>) = sin ωt', MORE = ' + sin 3ωt/3 + sin 5ωt/5 + sin 7ωt/7';

window.seek = function (tau) {
  const s = mod(tau, T), th = W * s, m = harm(s);
  // 四项自由依次高亮，每段 2 秒；第四段末尾交还给第一段，正好接上循环
  chips.forEach((c, i) => {
    const k = io3(span(mod(s - 2 * i + 0.25, T), 0, 0.25)) * (1 - io3(span(mod(s - 2 * i + 0.25, T), 2, 0.25)));
    c.style.background = mix(BG, LINE, k);
    c.style.color = mix(DIM, BG, k);
    c.style.borderColor = mix('#5f86bd', LINE, k);
  });
  // 旋转矢量：基频加上随 m 出现的谐波，形成一串小圆
  let x = CX, y = CY, d = `M${x},${y}`;
  TERMS.forEach((k, j) => {
    const r = R1 * (k === 1 ? 1 : m) / k;
    set(rings[j], { cx: x.toFixed(2), cy: y.toFixed(2), r: r.toFixed(2), visibility: r > 0.6 ? 'visible' : 'hidden' });
    x += r * Math.cos(k * th); y -= r * Math.sin(k * th);
    d += `L${x.toFixed(2)},${y.toFixed(2)}`;
  });
  arms.setAttribute('d', d);
  set(tip, { cx: x.toFixed(2), cy: y.toFixed(2) });
  set(proj, { x1: x.toFixed(2), y1: y.toFixed(2), x2: X0, y2: y.toFixed(2) });
  set(head, { cx: X0, cy: y.toFixed(2) });
  // 波形：横向每一点是更早时刻的 f，向右流出
  let w = '';
  for (let px = X0; px <= X1 + 0.01; px += 2) w += (w ? 'L' : 'M') + px + ',' + (CY - R1 * f(s - (px - X0) / V)).toFixed(2);
  wave.setAttribute('d', w);
  // 分发：波形复制到上下两路，再收回
  const out = io3(span(s, 6.05, 0.6)) * (1 - io3(span(s, 7.3, 0.6))), op = bump(s, 6.05, 7.9, 0.3), dy = 118 * out;
  copies.forEach((c, i) => set(c, { d: w, transform: `translate(0 ${(i ? 1 : -1) * dy})`, 'stroke-opacity': op, visibility: op > 0.01 ? 'visible' : 'hidden' }));
  copyHeads.forEach((c, i) => set(c, { cx: X0, cy: (y + (i ? 1 : -1) * dy).toFixed(2), 'fill-opacity': op, visibility: op > 0.01 ? 'visible' : 'hidden' }));
  set(fork, { x1: X0 - 10, x2: X0 - 10, y1: (y - dy).toFixed(2), y2: (y + dy).toFixed(2), 'stroke-opacity': op, visibility: op > 0.01 ? 'visible' : 'hidden' });
  // 研究：标出振幅、周期与相位
  const look = bump(s, 2.05, 3.95, 0.3), a = mod(th, 2 * Math.PI);
  dims.setAttribute('opacity', look);
  set(arcs, { d: `M${CX + 30},${CY}A30,30 0 ${a > Math.PI ? 1 : 0} 0 ${(CX + 30 * Math.cos(a)).toFixed(2)},${(CY - 30 * Math.sin(a)).toFixed(2)}`, 'stroke-opacity': look });
  ['nA', 'nT', 'nW'].forEach((id) => { $(id).style.opacity = look; });
  place('nW', CX + 48 * Math.cos(a / 2) - 10, CY - 48 * Math.sin(a / 2) - 8);
  // 修改：公式随谐波一项项改写
  const n = Math.round(m * MORE.length);
  $('formula').innerHTML = BASE + (n ? `<span class="add">${MORE.slice(0, n)}</span>` : '');
};
window.READY = document.fonts.ready.then(() => Promise.all(['900 188px Inter', '900 78px "Sans SC"', '500 21px "Sans SC"', '700 23px "Sans SC"', '700 18px Mono', 'italic 600 16px Mono'].map((font) => document.fonts.load(font, 'f(t)自由视频与软件一样人人可以运行研究修改分发源码文案工具全部公开GPL-3.0ωAT')))).then(() => window.seek(0));
</script>
</body>
</html>
