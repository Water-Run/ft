<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>关键帧 C · 黄底·稀疏索引</title>
<!-- 审片页的关键帧 C：反过来用黄做底、黑做字与块（海报式版面），大数字压住画面，索引条与二分的括号是唯一的图形。
     数据取自 research/lab/out_04_queries.txt：12209 个索引项、47.69 KiB、二分选中 1/12208 个颗粒。只作方向示意。 -->
<link rel="stylesheet" href="/css/base.css">
<style>
  :root { --y: #FAFF69; --k: #151515; --k2: #282828; --g: #606060; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--y); color: var(--k); overflow: hidden; }
  .tag { position: absolute; left: 96px; top: 72px; font: 700 22px/1 "Inter"; letter-spacing: .18em; }
  .tag b { background: var(--k); color: var(--y); padding: 6px 12px; margin-right: 18px; }
  .num { position: absolute; left: 88px; top: 120px; font: 900 300px/1 "Inter"; letter-spacing: -.04em; }
  .numt { position: absolute; left: 100px; top: 430px; font: 700 40px/1.3 "Sans SC"; }
  .numt span { font: 600 30px/1 "Mono"; display: block; margin-top: 10px; }
  .strip { position: absolute; left: 96px; top: 640px; width: 1728px; height: 90px; background: var(--k); }
  .tick { position: absolute; top: 0; width: 2px; height: 90px; background: #3a3a2a; }
  .g0 { position: absolute; left: 0; top: -14px; width: 18px; height: 118px; background: var(--y); outline: 6px solid var(--k); }
  .br { position: absolute; top: 590px; height: 30px; border: 5px solid var(--k); border-bottom: 0; }
  .bl { position: absolute; font: 600 22px/1 "Mono"; }
  .keys { position: absolute; left: 96px; top: 750px; font: 600 26px/1 "Mono"; }
  .keys b { background: var(--k); color: var(--y); padding: 4px 10px; }
  .hit { position: absolute; right: 96px; top: 150px; width: 560px; background: var(--k); color: var(--y); padding: 36px 40px; font: 600 30px/1.6 "Mono"; }
  .hit .s { color: #A0A0A0; font-size: 22px; }
  .hit .alice { font-size: 56px; font-weight: 800; color: var(--y); }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; display: flex; align-items: center; justify-content: center; font: 600 40px/1 "Sans SC"; background: var(--k); color: var(--y); }
</style></head><body>
<div id="bg" style="position:absolute;inset:0;background:#FAFF69;z-index:-1"></div>
<div class="tag"><b>PART 5</b>04 · 稀疏索引</div>
<div class="num">12,209</div>
<div class="numt">个索引项，管着一亿行<span>每 8192 行一项 · 47.69 KiB · 整个放进内存</span></div>
<div class="hit"><div class="s">EXPLAIN indexes = 1</div>Granules: <b>1/12208</b><br>binary search<div class="s" style="margin-top:18px">第 0 个颗粒 · 8192 行</div><div class="alice">2050 Alice 42</div></div>
<div class="strip" id="s"><div class="g0"></div></div>
<div class="br" style="left:96px;width:1728px"></div><div class="bl" style="left:96px;top:556px">1 … 12208</div>
<div class="br" style="left:96px;width:864px;top:606px"></div>
<div class="br" style="left:96px;width:216px;top:622px;border-width:4px"></div>
<div class="keys"><b>1</b>&nbsp;&nbsp;8193&nbsp;&nbsp;16385&nbsp;&nbsp;24577&nbsp;&nbsp;32769&nbsp;&nbsp;…&nbsp;&nbsp;99991553&nbsp;&nbsp;99999745&nbsp;&nbsp;100000000</div>
<div class="cap">二〇五〇比一大、比八一九三小，二分一下，她在第零个颗粒里</div>
<script>
  const s = document.getElementById('s');
  for (let i = 1; i < 144; i++) s.insertAdjacentHTML('beforeend', `<div class="tick" style="left:${i * 12}px"></div>`);
</script>
<script>document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });</script>
</body></html>
