<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面（第 4 轮重做）：?r=169 → 1920×1080，?r=43 → 1600×1200。kit/tools/covers.js 按 2 倍像素出图。
     做法同本系列前几集：强色底、产品名做特大字、一句点题、右边一个大的立体实物。底色取 MongoDB 的深常青 #001E2B，
     底纹是 Alice 那 47 个字节（A04）的十六进制，压得很淡；立体是三棵等轴测的树，立在三块文件板上，叶页数照实测（B03 B06 B07：4、3、15），
     Alice 所在的叶页亮绿，姓名索引第 1 页到集合树第 2 页一条发光的查找路径（C02）。全部平涂，不用阴影与渐变（flat: true）；文字不变形，缩略图可读。不放产品标志。 */
  :root { --bg: #001E2B; --bg2: #023430; --spring: #00ED64; --mint: #71F6BA; --white: #FFFFFF; --mist: #C1C7C6; }
  html, body, #stage { width: var(--W); height: var(--H); margin: 0; }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { position: relative; background: var(--bg); color: var(--white); overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; }
  .txt { position: absolute; white-space: nowrap; }
  .tex { position: absolute; left: -40px; top: -20px; font: 600 30px/52px "Mono"; color: #0A3340; white-space: pre; letter-spacing: .08em; }
  .part { font: 800 40px "Mono"; letter-spacing: .1em; color: var(--bg); background: var(--spring); padding: 6px 22px; border-radius: 8px; }
  .ask { font: 600 54px/1.2 "Sans SC"; color: var(--white); }
  .no { font: 900 150px/1 "Sans SC"; color: var(--white); letter-spacing: -.01em; }
  .no i { font-style: normal; font-family: "Inter"; font-weight: 900; }
  .mdb { font: 900 192px/1 "Inter"; color: var(--spring); letter-spacing: -.035em; }
  .sub { font: 700 64px/1.1 "Serif SC"; color: var(--mint); }
  .fact { font: 600 34px/1.4 "Mono"; color: var(--mist); }
  .fact b { color: var(--spring); font-weight: 800; }
  .lab { font-family: "Sans SC"; font-weight: 700; fill: #FFFFFF; }
  .labm { font-family: "Mono"; font-weight: 700; fill: #71F6BA; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', R43 = q.get('r') === '43';
  document.documentElement.className = (R43 ? 'r43' : 'r169') + ' ' + lang;
  const W = R43 ? 1600 : 1920, H = R43 ? 1200 : 1080, stage = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const html = (cls, x, y, inner) => { const d = document.createElement('div'); d.className = 'txt ' + cls; d.style.left = x + 'px'; d.style.top = y + 'px'; d.innerHTML = inner; stage.appendChild(d); return d; };

  // 底纹：Alice 的 47 个字节（A04），一行行铺满，压得很淡
  const HEX = '2f 00 00 00 07 5f 69 64 00 6a fa 6c a2 6f 27 50 6c fb 0a 4e 81 02 6e 61 6d 65 00 06 00 00 00 41 6c 69 63 65 00 10 61 67 65 00 2a 00 00 00 00 ';
  const tex = document.createElement('div'); tex.className = 'tex'; tex.setAttribute('data-bleed', ''); tex.setAttribute('data-overlap-ok', '');
  tex.textContent = Array.from({ length: 26 }, (_, i) => (HEX + HEX).slice((i * 9) % 141, (i * 9) % 141 + 150)).join('\n');
  stage.appendChild(tex);

  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H); stage.appendChild(svg);
  const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  // 二等角投影：x 向右略下，y 向左下（朝向观众），z 向上
  let O = [0, 0], K = 1; const AX = 0.94, AY = 0.30, BX = 0.56, BY = 0.42;
  const P = (x, y, z) => [O[0] + K * (x * AX - y * BX), O[1] + K * (x * AY + y * BY - z)];
  const pts = (a) => a.map((p) => P(...p).map((v) => v.toFixed(1)).join(',')).join(' ');
  // 色组：顶面、正面、侧面、描边
  const C = {
    slab:  ['#0B4A45', '#063A36', '#032B2A', '#0F5F57'],
    white: ['#FFFFFF', '#D9E3DF', '#B9C8C2', '#E8EDEB'],
    green: ['#00ED64', '#00B84D', '#00964A', '#71F6BA'],
    root:  ['#71F6BA', '#3CCB8A', '#20A86D', '#C0FAE6'],
  };
  const boxes = [];
  const box = (x, y, z, w, d, h, col, layer) => boxes.push({ x, y, z, w, d, h, col, layer });
  function fit(rect) {
    O = [0, 0]; K = 1; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const b of boxes) for (const dx of [0, b.w]) for (const dy of [0, b.d]) for (const dz of [0, b.h]) { const [u, v] = P(b.x + dx, b.y + dy, b.z + dz); x0 = Math.min(x0, u); x1 = Math.max(x1, u); y0 = Math.min(y0, v); y1 = Math.max(y1, v); }
    const [rx, ry, rw, rh] = rect; K = Math.min(rw / (x1 - x0), rh / (y1 - y0));
    O = [rx + (rw - K * (x1 - x0)) / 2 - K * x0, ry + (rh - K * (y1 - y0)) / 2 - K * y0];
  }
  function drawBoxes(filter) {
    const list = boxes.filter(filter).sort((a, b) => a.layer - b.layer || (a.y + a.d) - (b.y + b.d) || a.x - b.x || a.z - b.z);
    for (const b of list) {
      const [t, f, s, k] = C[b.col], { x, y, z, w, d, h } = b;
      const face = (a, fill) => el('polygon', { points: pts(a), fill, stroke: k, 'stroke-width': 1.4, 'stroke-linejoin': 'round' });
      face([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], s);
      face([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], f);
      face([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], t);
    }
  }
  const line = (a, b, attrs) => { const [x1, y1] = P(...a), [x2, y2] = P(...b); return el('line', { x1, y1, x2, y2, ...attrs }); };
  const text = (xy, s, cls, size, anchor = 'start') => { const t = el('text', { x: xy[0], y: xy[1], class: cls, 'font-size': size, 'text-anchor': anchor }); t.textContent = s; return t; };

  // 三块文件板，每块上立一棵树：集合（4 个叶页，第 2 个是 Alice）、_id 索引（3 个）、姓名索引（15 个，第 1 个是 Alice）
  const L = 600, D = 120, GAP = 330, ZR = 210, LH = 120;
  function tree(g, y, leaves) {
    box(0, y, 0, L, D, 22, 'slab', g * 10);
    const gap = 10, total = leaves.reduce((a, l) => a + l.w, 0) + gap * (leaves.length - 1);
    let x = (L - total) / 2; const tops = [];
    for (const l of leaves) { box(x, y + 18, 22, l.w, 84, l.h, l.hi ? 'green' : 'white', g * 10 + 1); tops.push([x + l.w / 2, y + 60, 22 + l.h]); x += l.w + gap; }
    box(L / 2 - 46, y + 28, 22 + ZR, 92, 64, 30, 'root', g * 10 + 2);
    return { tops, root: [L / 2, y + 60, 22 + ZR], y, g };
  }
  const coll = tree(1, 0, [{ w: 150, h: LH }, { w: 150, h: LH, hi: true }, { w: 80, h: LH * 0.62 }, { w: 120, h: LH * 0.85 }]);
  const idx = tree(2, GAP, [{ w: 170, h: LH * 0.7 }, { w: 110, h: LH * 0.7 }, { w: 150, h: LH * 0.7 }]);
  const name = tree(3, 2 * GAP, Array.from({ length: 15 }, (_, i) => ({ w: 30, h: LH * 0.6, hi: i === 0 })));
  fit(R43 ? [560, 720, 820, 430] : [1100, 230, 590, 720]);
  // 由后往前：每一组先画板与连线，再画方块（连线在方块后面）
  const wire = { stroke: '#4F8A7D', 'stroke-width': 2 };
  for (const t of [coll, idx, name]) {
    drawBoxes((b) => b.layer === t.g * 10);
    for (const p of t.tops) line(t.root, p, wire);
    drawBoxes((b) => b.layer > t.g * 10 && b.layer < t.g * 10 + 10);
  }
  // Alice 的路径：姓名索引根页 → 第 1 页 →（2050）→ 集合树根页 → 第 2 页
  const g = { stroke: '#00ED64', 'stroke-width': 9, 'stroke-linecap': 'round', fill: 'none' };
  line(name.root, name.tops[0], g); line(coll.root, coll.tops[1], g);
  const [ax, ay] = P(...name.tops[0]), [bx, by] = P(...coll.root);
  el('path', { d: `M${ax},${ay - 6} C${ax - 120},${ay - 260} ${bx - 260},${by + 40} ${bx - 4},${by + 6}`, ...g, 'stroke-dasharray': '2 18' });
  text([ax - 14, ay - 22], 'Alice', 'labm', 38, 'end');
  const [cx, cy] = P(...coll.tops[1]); text([cx + 34, cy - 26], '2050', 'labm', 44);
  for (const [t, s, n] of [[coll, '集合 users', '4 个叶页'], [idx, '_id 索引', '3 个叶页'], [name, '姓名索引', '15 个叶页']]) {
    const [x0, y0] = P(L, t.y + D / 2, 11); text([x0 + 22, y0 + 4], s, 'lab', 34); text([x0 + 22, y0 + 42], n, 'labm', 28);
  }

  // 文字：集数、系列问句、点题、产品名、副题、一行实测
  const X = R43 ? 90 : 100, Y = R43 ? 70 : 92;
  html('part', X, Y, 'PART 6');
  html('ask', X, Y + 92, '一个数据库引擎是如何实现的？');
  html('no', X - 4, Y + 186, '不是 <i>SQL</i>');
  html('mdb', X - 12, Y + 344, 'MongoDB');
  html('sub', X, Y + 566, '存储引擎 WiredTiger');
  if (!R43) html('fact', X, Y + 690, '按名字找 Alice：看 <b>1</b> 个索引键、<b>1</b> 份文档<br>不建索引：要看 <b>4096</b> 份');

  const sample = stage.textContent + '0123456789';
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('700 40px "Serif SC"', sample), document.fonts.load('700 40px "Mono"', sample), document.fonts.load('900 40px "Inter"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
