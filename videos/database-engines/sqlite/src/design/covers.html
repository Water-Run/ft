<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SQLite 封面候选</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  body, #stage { background: #ffffff; }
  svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../js/data.js"></script>
<script src="docpage.js"></script>
<script>
// 封面候选（审片页里选一张，选定后落到 src/cover.html）：?c=1 一个文件、?c=2 立体的铁路图、?c=3 热日志。16:9，1920×1080 设计、出图时放大。
// 系列要求（数据库引擎系列说明「封面」）：有质感、立体、契合本集；集数标签、问句、大标题、一幅讲清要点的图、实测数据；立体不压字；
// 主标题约为画面高度的五分之一；底部 15% 不放字。本集的视觉是「像一页 sqlite.org 文档」：封面也是一页文档——页头、菜单、黑色正文、深青标题、
// 代码块里的实测数据；立体做在文档的「纸」上（纸堆、立起来的铁路图方框），线是黑色细线，强调只用文档的悬停麦色。数字出自 FACTS：J01、I01、E05、J05。
const D = window.DATA, CV = +(new URLSearchParams(location.search).get('c') || 1);
const { C, el, text, rich, chrome, codeblock, button, todo, rrLine, arrowHead, iso, poly, paperStack } = DOC;
DOC.init(document.getElementById('stage'));
const P = (x, y, z) => iso.P(x, y, z);
const pts = (a) => a.map((q) => q.join(',')).join(' ');

// 左栏：问句（黑色正文）、大标题（深青常规字重，字高约画面高度的五分之一）、副题、代码块里的实测数据
function left(q1, q2, data) {
  chrome(0);
  text(60, 262, q1, { 'font-size': 50 });
  text(60, 330, q2, { 'font-size': 50 });
  text(44, 600, 'SQLite', { 'font-size': 280, fill: C.teal, 'letter-spacing': '-6' });
  text(60, 680, '小而强大　·　一个数据库引擎是如何实现的？', { 'font-size': 34, fill: C.teal });
  codeblock(60, 720, data, 28);
}
// 一块有厚度的方框（立起来的铁路图方框 / 抽出来的书签页）：顶、左前、右前三面，黑色细线
function block(x, y, z, w, d, h, top = '#fff') {
  const st = { stroke: C.ink, 'stroke-width': 1.8, 'stroke-linejoin': 'round' };
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], { fill: '#f0f0f0', ...st });
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], { fill: '#e0e0e0', ...st });
  poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], { fill: top, ...st });
}

if (CV === 1) {
  left('一个库、一个文件，', '怎样装下一个完整的关系数据库？', ['main.db　553 页 × 1024 字节', '找 Alice 读到的页：1 262 281 263 2 133 130']);
  // 553 页叠成一摞文档纸（第 1 页在最上面）；读到的 7 页像书签一样从右侧抽出来，页号写在灰色小按钮上
  iso.set([1330, 560], 0.78);
  const W = 400, Dp = 300, H = 300;
  paperStack(0, 0, 0, W, Dp, H, 44);
  const zOf = (p) => H * (1 - (p - 1) / 553) - 6;
  const tabs = [[1, 30], [2, 170], [130, 40], [133, 175], [262, 35], [263, 170], [281, 100]];
  tabs.sort((a, b) => zOf(b[0]) - zOf(a[0]) || a[1] - b[1]);
  for (const [p, y0] of tabs) block(W, y0, zOf(p), 120, 90, 6, C.wheat);
  // 页号：书签的高度按页码真实比例，挨得近的几页会挤在一起；页号用细引线引到右侧一列，从上到下排开，写在灰色小按钮上
  const ends = tabs.map(([p, y0]) => { const [sx, sy] = P(W + 120, y0 + 45, zOf(p) + 6); return { p, sx, sy }; }).sort((a, b) => a.p - b.p);   // 按页码排：第 1 页在最上，和纸堆里的上下次序一致
  let ly = -1e9;
  for (const e of ends) { ly = Math.max(e.sy, ly + 46); el('polyline', { points: pts([[e.sx, e.sy], [e.sx + 24, e.sy], [1736, ly]]), fill: 'none', stroke: '#888', 'stroke-width': 1.2 }); button(1744, ly + 10, String(e.p), 26); }
  rich(1080, 880, ['main.db：553 页叠起来，', ['读到的 7 页'], '抽了出来'], 28);
}

if (CV === 2) {
  left('按名字找 Alice，', '553 页里要读几页？', ['7 页：1 → 262 → 281 → 263', '　　 → 2 → 133 → 130']);
  // 立体的铁路图：读页的路线铺在地面上，每一页是一个立起来的方框，页号印在顶面；姓名索引一组、users 表一组（浅灰分组框）
  iso.set([1040, 330], 0.6);
  const bw = 120, bd = 90, bh = 46, gap = 64;
  const seq = [['1', '文件头'], ['262'], ['281'], ['263', 1], ['2'], ['133'], ['130', 1]];
  const xs = []; let x = 70;
  seq.forEach((s, i) => { if (i === 1 || i === 4) x += 60; xs.push(x); x += bw + gap; });
  const end = x - gap + 40, ty = bd / 2;
  // 分组框（地面上，浅灰）与组名
  const grp = (i0, i1, name) => { const x0 = xs[i0] - 35, x1 = xs[i1] + bw + 35, y0 = -40, y1 = bd + 40; poly([P(x0, y0, 0), P(x1, y0, 0), P(x1, y1, 0), P(x0, y1, 0)], { fill: 'none', stroke: C.group, 'stroke-width': 2 }); const [lx, ly] = P(x0, y0, 0); text(lx + 8, ly - 12, name, { 'font-size': 24, 'font-style': 'italic', fill: '#888' }); };
  grp(1, 3, '姓名索引'); grp(4, 6, 'users 表');
  // 轨道：黑线，段间实心箭头（沿轨道方向）
  const [s0x, s0y] = P(0, ty, 0); el('ellipse', { cx: s0x, cy: s0y, rx: 9, ry: 6, fill: '#fff', stroke: C.ink, 'stroke-width': 2 });
  const seg = (a, b) => { const [ax, ay] = P(a, ty, 0), [bx, by] = P(b, ty, 0); rrLine(`M${ax},${ay} L${bx},${by}`, { sw: 2.2 }); const ang = Math.atan2(by - ay, bx - ax), s = 11; el('polygon', { points: pts([[bx, by], [bx - s * 1.5 * Math.cos(ang) + s * 0.7 * Math.sin(ang), by - s * 1.5 * Math.sin(ang) - s * 0.7 * Math.cos(ang)], [bx - s * 1.5 * Math.cos(ang) - s * 0.7 * Math.sin(ang), by - s * 1.5 * Math.sin(ang) + s * 0.7 * Math.cos(ang)]]), fill: C.ink }); };
  seg(9, xs[0]); for (let i = 0; i < seq.length - 1; i++) seg(xs[i] + bw, xs[i + 1]); seg(xs[seq.length - 1] + bw, end);
  const [ex, ey] = P(end, ty, 0); el('rect', { x: ex + 2, y: ey - 14, width: 4, height: 28, fill: C.ink }); el('rect', { x: ex + 12, y: ey - 14, width: 4, height: 28, fill: C.ink });
  // 方框：从远到近画；页号印在顶面中心（正立，好读）
  seq.forEach(([s, hot], i) => { block(xs[i], 0, 0, bw, bd, bh, hot === 1 ? C.wheat : '#fff'); const [cx, cy] = P(xs[i] + bw / 2, bd / 2, bh); text(cx, cy + 10, s, { 'font-family': 'Mono', 'font-size': 30, 'text-anchor': 'middle', fill: C.ink }); });
  const [fx, fy] = P(xs[0] + bw / 2, bd, 0); text(fx - 30, fy + 40, '文件头', { 'font-size': 24, fill: C.dim, 'text-anchor': 'middle' });
  rich(1080, 880, ['首次查询向文件读的页，', ['依次就这 7 页']], 28);
}

if (CV === 3) {
  left('改到一半，进程被强行终止，', '重新打开还对吗？', ['重开后：4096 行，Alice = 42', '整个文件的 SHA-256 与改之前相同']);
  // 两摞文档纸：主文件（顶面一格一页，改了一半的几页是麦色）与回滚日志（存着这些页原来的样子，浅灰）；重开时沿黑线从日志抄回去
  iso.set([1290, 420], 0.86);
  const W = 380, H = 170, n = 6, g = 12, c = (W - g * (n + 1)) / n;
  paperStack(0, 0, 0, W, W, H, 26);
  const changed = [[1, 1], [3, 0], [4, 3], [2, 4], [5, 2]], cell = (i, j) => [g + i * (c + g), g + j * (c + g)];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const hit = changed.some(([a, b]) => a === i && b === j), [x, y] = cell(i, j); poly([P(x, y, H), P(x + c, y, H), P(x + c, y + c, H), P(x, y + c, H)], { fill: hit ? C.wheat : '#fff', stroke: C.ink, 'stroke-width': hit ? 1.6 : 1 }); }
  const [mx] = P(W / 2, W, 0), [, mb] = P(W, W, 0); text(mx, mb + 44, 'main.db', { 'font-family': 'Mono', 'font-size': 30, 'text-anchor': 'middle' });
  // 回滚日志
  iso.set([1700, 650], 0.86);
  const JW = 170, JH = 54, jc = (JW - g * 4) / 3;
  paperStack(0, 0, 0, JW, JW, JH, 8);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { if (i * 3 + j > 4) continue; const x = g + i * (jc + g), y = g + j * (jc + g); poly([P(x, y, JH), P(x + jc, y, JH), P(x + jc, y + jc, JH), P(x, y + jc, JH)], { fill: '#dddddd', stroke: C.ink, 'stroke-width': 1 }); }
  const [jx, jy] = P(JW / 2, JW / 2, JH), [jlx] = P(JW / 2, JW, 0), [, jb] = P(JW, JW, 0);
  text(jlx, jb + 42, 'main.db-journal', { 'font-family': 'Mono', 'font-size': 28, 'text-anchor': 'middle' });
  // 重开：从日志抄回原页（黑色铁路线 + 实心箭头，落在改了一半的那一格），说明画成链接
  iso.set([1290, 420], 0.86);
  const [hx, hy] = (() => { const [x, y] = cell(4, 3); return P(x + c / 2, y + c / 2, H); })();
  rrLine(`M${jx},${jy - 4} C ${jx - 20},${jy - 250} ${hx + 140},${hy - 220} ${hx},${hy - 18}`, { sw: 2.4 }); arrowHead(hx, hy - 14, 'd', 9);
  rich(1560, 400, [['重开：从日志抄回原页']], 30);
  // 强行终止：文档 TODO 的红色斜体框，细红线指向改了一半的一页
  const [kx, ky] = (() => { const [x, y] = cell(1, 1); return P(x + c / 2, y + c / 2, H); })();
  el('line', { x1: 1080, y1: 236, x2: kx, y2: ky, stroke: C.todo, 'stroke-width': 1.6 });
  todo(990, 226, '强行终止：改到一半', 28);
}
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
