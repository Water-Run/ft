<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SQLite 关键帧</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  body, #stage { background: #ffffff; }
  svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../js/data.js"></script>
<script src="docpage.js"></script>
<script>
// 关键帧：静态页面，?f=1 片头、?f=2 users 的 B+ 树、?f=3 读了哪几页、?f=4 叶页 130。每一帧都像一页 sqlite.org 文档（零件见 docpage.js）。
// 所有页号、计数、偏移取自 data.js（tools/gen_data.py 由实测生成）；文字依据 FACTS：G15、J01、I01、H03、H05、J02、J03。
const D = window.DATA, F = +(new URLSearchParams(location.search).get('f') || 1);
const { C, el, text, rich, chrome, pageTitle, h2, footer, sidebar, button, codeblock, table, rrBox, arrowHead, rrLine, rrStart, rrGroup } = DOC;
DOC.init(document.getElementById('stage'));

if (F === 1) {
  chrome(0);
  pageTitle('小而强大：SQLite', 290, 96);
  text(960, 352, 'PART 4　·　一个数据库引擎是如何实现的？', { 'font-size': 34, 'text-anchor': 'middle' });
  rich(60, 450, ['SQLite 是一个进程内的库，实现了一个', ['自包含'], '、', ['无服务器'], '、', ['零配置'], '、'], 32);
  rich(60, 498, [['事务型'], '的 SQL 数据库引擎。'], 32);
  rich(60, 566, ['本片用的版本：', ['3.54.1'], '（2026-10-16）。'], 32);
  button(680, 566, '一个库'); button(820, 566, '一个文件');
  DOC.h2(60, 650, '1. 一个文件', 40);
  text(60, 700, 'main.db：553 页 × 1024 字节；按名字找 Alice，只读了其中 7 页。', { 'font-size': 30 });
  // 553 页，一页一格：表的页白底、索引的页浅灰、读到的 7 页麦色（文档的悬停色）
  const own = D.file.owner, read = [1, 262, 281, 263, 2, 133, 130], fill = { u: '#ffffff', n: '#dddddd', a: '#eeeeee', s: '#cfcfcf', t: '#cfcfcf', o: '#f6f6f6' };
  for (let i = 0; i < own.length; i++) { const x = 60 + (i % 79) * 15, y = 730 + Math.floor(i / 79) * 15, hit = read.includes(i + 1); el('rect', { x, y, width: 13, height: 13, fill: hit ? C.wheat : fill[own[i]], stroke: hit ? C.teal : '#8a8a8a', 'stroke-width': hit ? 2 : 0.7 }); }
  [['#ffffff', 'users 表'], ['#dddddd', '姓名索引'], ['#eeeeee', '年龄索引'], [C.wheat, '读到的页']].forEach(([f, s], i) => { const x = 60 + i * 230; el('rect', { x, y: 862, width: 22, height: 22, fill: f, stroke: '#8a8a8a', 'stroke-width': 1 }); text(x + 32, 881, s, { 'font-size': 26 }); });
  sidebar(1340, 400, 520, '本集目录', ['1. 一个库，一个文件', '2. 怎么放', '3. 怎么找', '4. 一页里有什么', '5. 回滚日志', '6. WAL', '7. 删', '8. 五个问题'], 28);
  footer('本页的数字取自实测：main.db，SQLite 3.54.1');
}

if (F === 2) {
  chrome(2);
  pageTitle('怎么放');
  h2(60, 320, '2.1. B+ 树');
  rich(60, 378, ['users 表是一棵 ', ['B+ 树'], '：4096 行全在叶页里；', ['内部页'], '只存分界和子页的页号。'], 32);
  const U = D.users, by = Object.fromEntries(U.nodes.map((n) => [n.p, n])), r = by[U.root], mids = r.c.map((p) => by[p]);
  const leaves = mids.flatMap((m) => m.c), X0 = 60, W = 1800, pitch = W / leaves.length, leafX = Object.fromEntries(leaves.map((p, i) => [p, X0 + i * pitch]));
  // 根页画成一行格子：指针格夹着分界格（文档表格的黑线）
  const slot = 40, kw = 120, rw = slot * (r.s.length + 1) + kw * r.s.length, rx = 960 - rw / 2, ry = 440, rh = 60, ptr = [];
  let cx = rx;
  for (let i = 0; i <= r.s.length; i++) {
    el('rect', { x: cx, y: ry, width: slot, height: rh, fill: '#fff', stroke: C.ink, 'stroke-width': 2 }); el('circle', { cx: cx + slot / 2, cy: ry + rh / 2, r: 5, fill: C.ink }); ptr.push(cx + slot / 2); cx += slot;
    if (i < r.s.length) { el('rect', { x: cx, y: ry, width: kw, height: rh, fill: i === 0 ? C.wheat : '#fff', stroke: C.ink, 'stroke-width': 2 }); text(cx + kw / 2, ry + 42, r.s[i], { 'font-family': 'Mono', 'font-size': 32, 'text-anchor': 'middle' }); cx += kw; }
  }
  text(rx + rw + 20, ry + 40, '根页 2', { 'font-size': 28 });
  const my = 610, mh = 56, mw = 220, mp = {};
  mids.forEach((m, i) => {
    const xs = m.c.map((p) => leafX[p]), mx = (xs[0] + xs[xs.length - 1] + pitch) / 2; mp[m.p] = mx;
    rrLine(`M${ptr[i]},${ry + rh / 2} L${mx},${my}`, { sw: 1.5 });
    el('rect', { x: mx - mw / 2, y: my, width: mw, height: mh, fill: '#fff', stroke: C.ink, 'stroke-width': 2 });
    text(mx, my + 38, `第 ${m.p} 页`, { 'font-size': 28, 'text-anchor': 'middle' });
    text(mx, my + mh + 34, `${m.n} 个分界 · ${m.c.length} 个子页`, { 'font-size': 24, 'text-anchor': 'middle', fill: C.dim });
  });
  const ly = 780, lh = 90;
  for (const m of mids) for (const p of m.c) el('line', { x1: mp[m.p], y1: my + mh, x2: leafX[p] + pitch / 2, y2: ly, stroke: '#9a9a9a', 'stroke-width': 0.6 });
  for (const p of leaves) el('rect', { x: leafX[p] + 0.6, y: ly, width: pitch - 1.2, height: lh, fill: p === 99 ? C.wheat : '#fff', stroke: p === 99 ? C.teal : C.ink, 'stroke-width': p === 99 ? 2 : 0.6 });
  const k0 = rx + slot + kw / 2;
  el('path', { d: `M${k0} ${ry + rh} C ${k0} ${ry + 220}, ${leafX[99] + pitch / 2} ${ly - 170}, ${leafX[99] + pitch / 2} ${ly - 6}`, fill: 'none', stroke: C.ink, 'stroke-width': 1.5, 'stroke-dasharray': '8 6' }); arrowHead(leafX[99] + pitch / 2, ly - 4, 'd', 7);
  rich(leafX[99] + pitch / 2 + 16, ly - 20, [['叶页 99'], '：第 1560 行在这里'], 26);
  text(60, ly + lh + 44, '256 个叶页，都在第三层。', { 'font-size': 28 });
}

if (F === 3) {
  chrome(3);
  pageTitle('怎么找');
  h2(60, 320, '3.1. 读了哪几页');
  codeblock(60, 350, ["SELECT * FROM users WHERE name = 'Alice';"], 28);
  // 铁路图：首次查询向文件读的页，依次 7 页（I01）；姓名索引一组、users 表一组（浅灰分组框，竖排灰色斜体名，同语法图）
  const y = 560; rrStart(80, y);
  const b1 = rrBox(130, y, '第 1 页', {}); rrLine(`M87,${y} L130,${y}`);
  text(b1.x + b1.w / 2, y + 62, '文件头', { 'font-size': 24, fill: C.dim, 'text-anchor': 'middle' });
  let x = b1.r + 70; rrLine(`M${b1.r},${y} L${x},${y}`); arrowHead(x, y);
  const gx0 = x - 24, gn = [];
  for (const [s, cap] of [['262', '根'], ['281', '中层'], ['263', '叶']]) { const b = rrBox(x, y, s, { mono: true, w: 130, fill: s === '263' ? C.wheat : '#fff' }); text(b.x + b.w / 2, y + 62, cap, { 'font-size': 24, fill: C.dim, 'text-anchor': 'middle' }); gn.push(b); x = b.r + 60; rrLine(`M${b.r},${y} L${x},${y}`); arrowHead(x, y); }
  rrGroup(gx0, y - 70, x - gx0 - 30, 160, '姓名索引');
  x += 70; rrLine(`M${x - 70},${y} L${x},${y}`); arrowHead(x, y);
  const gx1 = x - 24;
  for (const [s, cap] of [['2', '根'], ['133', '中层'], ['130', '叶']]) { const b = rrBox(x, y, s, { mono: true, w: 130, fill: s === '130' ? C.wheat : '#fff' }); text(b.x + b.w / 2, y + 62, cap, { 'font-size': 24, fill: C.dim, 'text-anchor': 'middle' }); x = b.r + 60; rrLine(`M${b.r},${y} L${x},${y}`); arrowHead(x, y); }
  rrGroup(gx1, y - 70, x - gx1 - 30, 160, 'users 表');
  rrLine(`M${x},${y} L${x + 40},${y}`); el('rect', { x: x + 40, y: y - 14, width: 4, height: 28, fill: C.ink }); el('rect', { x: x + 50, y: y - 14, width: 4, height: 28, fill: C.ink });
  rich(60, 720, ['首次查询向文件读的页，依次就这 7 页：先在', ['姓名索引'], '里找到行号 2050，再到 ', ['users 表'], '里取整行。'], 30);
  table(60, 800, [['', 200], ['姓名索引', 330], ['users 表', 330]], [['每层剩下', '4096 → 306 → 18', '4096 → 1521 → 17']], 28);
}

if (F === 4) {
  chrome(4);
  pageTitle('一页里有什么');
  h2(60, 320, '4.1. 叶页 130');
  const P = D.page130;
  table(60, 380, [['偏移', 160], ['大小', 160], ['内容', 900]], [
    [['0', 0, 'Mono'], ['8', 0, 'Mono'], ['页头：标志 0x0d（表的叶页），17 个单元']],
    [['8', 0, 'Mono'], [String(P.pointer_array[1] - 8), 0, 'Mono'], ['17 个单元指针，每个 2 字节，按行号排序']],
    [[String(P.pointer_array[1]), 0, 'Mono'], [String(P.unallocated_bytes), 0, 'Mono'], ['未分配的空地']],
    [[String(P.cell_content_start), 0, 'Mono'], [String(1024 - P.cell_content_start), 0, 'Mono'], ['单元内容区：从页尾往前放']],
    [['489', 1, 'Mono'], ['13', 1, 'Mono'], ['Alice（行号 2050）的单元', 1]],
  ], 28, 50);
  // 整页按字节真实比例：黑细线分格；页头浅灰、指针区更浅、空地虚线；Alice 的单元麦色
  const X0 = 60, W = 1800, k = W / 1024, y = 690, h = 64, bx = (o) => X0 + o * k;
  el('rect', { x: bx(0), y, width: 8 * k, height: h, fill: '#dddddd' });
  el('rect', { x: bx(8), y, width: (P.pointer_array[1] - 8) * k, height: h, fill: '#eeeeee' });
  for (const c of P.cells) el('rect', { x: bx(c.off), y, width: c.bytes * k, height: h, fill: c.rowid === 2050 ? C.wheat : '#fff', stroke: C.ink, 'stroke-width': 0.8 });
  el('rect', { x: bx(P.pointer_array[1]), y: y + 4, width: P.unallocated_bytes * k, height: h - 8, fill: 'none', stroke: C.ink, 'stroke-width': 1, 'stroke-dasharray': '5 4' });
  el('rect', { x: X0, y, width: W, height: h, fill: 'none', stroke: C.ink, 'stroke-width': 2 });
  [[0, 'start'], [489, 'middle'], [1024, 'end']].forEach(([o, a]) => text(bx(o), y + h + 32, String(o), { 'font-family': 'Mono', 'font-size': 24, 'text-anchor': a }));
  // Alice 的 13 个字节：等宽十六进制，下面一行说明（文档表格的写法）
  const hex = D.aliceCellHex.match(/../g), cw = 66, hx = 960 - hex.length * cw / 2, hy = 840;
  hex.forEach((v, i) => { el('rect', { x: hx + i * cw, y: hy - 34, width: cw, height: 48, fill: i >= 3 ? C.wheat : '#fff', stroke: C.ink, 'stroke-width': 1.2 }); text(hx + i * cw + cw / 2, hy, v, { 'font-family': 'Mono', 'font-size': 28, 'text-anchor': 'middle' }); });
  rrLine(`M${bx(489)},${y + h} L${hx},${hy - 34} M${bx(502)},${y + h} L${hx + hex.length * cw},${hy - 34}`, { sw: 1, stroke: '#888' });
  [[0, 1, '长度'], [1, 3, '行号 2050'], [3, 7, '类型'], [7, 12, 'Alice'], [12, 13, '42']].forEach(([a, b, s]) => text(hx + a * cw + 4, hy + 44, s, { 'font-size': 22, fill: C.dim }));
}
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
