<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套视觉（方向 1「官网」）：官网的深色导航条、火鸟标志、Heebo 粗体字标与中文副题；底部约 15% 不放文字。 */
  @font-face { font-family: "Heebo"; src: url("/type/Heebo-wght.ttf"); font-weight: 100 900; }
  :root { --ink: #17222B; --teal: #2e6474; --page: #FCFCFC; --white: #FFFFFF; --g2: #DCDEDF; --g4: #3A434B; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--page); color: var(--ink); font-family: "Heebo", "Sans SC"; overflow: hidden; position: relative; }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 96px; background: var(--ink); }
  .bar img.m { position: absolute; left: 56px; top: 14px; height: 68px; }
  .bar .tab { position: absolute; top: 0; height: 96px; display: flex; align-items: center; padding: 0 30px; background: var(--teal); color: var(--white); font-size: 34px; font-weight: 500; }
  .mark { position: absolute; }
  .kicker { position: absolute; font-size: 50px; font-weight: 500; color: var(--g4); white-space: nowrap; }
  .fb { position: absolute; font-family: "Heebo"; font-weight: 800; letter-spacing: -6px; line-height: 1; white-space: nowrap; }
  .sub { position: absolute; font-weight: 700; white-space: nowrap; }
  .rule { position: absolute; border-top: 3px dashed var(--g2); }
  .r169 .bar .tab { left: 160px; }
  .r169 .mark { left: 100px; top: 196px; width: 560px; }
  .r169 .kicker { left: 740px; top: 200px; }
  .r169 .fb { left: 728px; top: 290px; font-size: 250px; }
  .r169 .rule { left: 740px; top: 590px; width: 1060px; }
  .r169 .sub { left: 740px; top: 630px; font-size: 128px; }
  .r43 .bar .tab { left: 160px; }
  .r43 .mark { left: 90px; top: 170px; width: 420px; }
  .r43 .kicker { left: 560px; top: 250px; font-size: 46px; }
  .r43 .fb { left: 76px; top: 600px; font-size: 360px; letter-spacing: -9px; }
  .r43 .rule { left: 96px; top: 900px; width: 1400px; display: none; }
  .r43 .sub { left: 560px; top: 380px; font-size: 118px; }
</style>
</head>
<body>
<div id="stage">
  <div class="bar"><img class="m" src="img/fb-mark.png"><div class="tab">数据库引擎 · 第 4 集</div></div>
  <img class="mark" src="img/fb-mark.png">
  <div class="kicker">一个数据库引擎是如何实现的？</div>
  <div class="fb">Firebird</div>
  <div class="rule"></div>
  <div class="sub">小众的第三选择</div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh';
  document.documentElement.className = (q.get('r') === '43' ? 'r43' : 'r169') + ' ' + lang;
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('700 40px "Sans SC"', sample), document.fonts.load('500 40px "Sans SC"', sample), document.fonts.load('800 40px "Heebo"', 'Firebird')])
    .then(() => document.fonts.ready)
    .then(() => Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = r; i.onerror = r; })))))
    .then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
