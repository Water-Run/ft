<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>PostgreSQL 封面 R2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&family=Noto+Sans+SC:wght@500;700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 封面 R2（2026-10-26）。WaterRun 看过 R1：「封面的PostgreSQL 可能使用一种有区分度的蓝色, 或者Pg官方色中和蓝色底的对比色 需要官方配色」。
   颜色只取 postgresql.org 官网样式表 main.css 里的官方配色：
     #336791 官方 Pg 蓝（标题、链接、主按钮）  #264d6d 深蓝  #193145 链接悬停的深蓝  #e7eae8 极浅灰
     #699eca 深色主题下的 Pg 蓝  #50b0f0 深色主题下的高亮蓝
   两种做法各出一张，版式相同：
     A 深蓝底：底色换成官方深蓝 #264d6d，「PostgreSQL」用深色主题的高亮蓝 #50b0f0（和底色的对比 3.7:1）；
     B 白板：底色仍是 Pg 蓝，「PostgreSQL」用 Pg 蓝写在一块立体的白板上（像官网白底蓝字的标题，对比 6:1）。
   其余同 R1：纸纹与网格（固定种子）、等轴立体的堆页与索引树、ctid；不放标志（P84），立体不损害可读性（P83）。 */
:root { --pg: #336791; --dark: #264d6d; --navy: #193145; --sky: #699eca; --hi: #50b0f0; --gray: #e7eae8; }
html, body { margin: 0; background: #0d1a24; }
.cv { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Open Sans", "Noto Sans SC", sans-serif; margin-bottom: 40px; }
.cv.a { background: var(--dark); }
.cv.b { background: var(--pg); }
svg.full { position: absolute; left: 0; top: 0; }
.part { position: absolute; left: 96px; top: 96px; font: 800 40px "Open Sans"; color: #fff; padding: 6px 22px; border: 4px solid #fff; letter-spacing: 2px; }
.q { position: absolute; left: 100px; top: 210px; font: 700 46px "Noto Sans SC"; color: #cfe0ee; }
.t1 { position: absolute; left: 92px; top: 300px; font: 900 148px "Noto Sans SC"; color: #fff; letter-spacing: 4px; }
.t2 { position: absolute; left: 92px; top: 500px; font: 800 168px "Open Sans"; letter-spacing: -2px; white-space: nowrap; }
.a .t2 { color: var(--hi); }
.b .t2 { color: var(--pg); left: 132px; top: 512px; font-size: 150px; }
.facts { position: absolute; left: 100px; top: 760px; font: 600 34px "Noto Sans SC"; color: #cfe0ee; line-height: 1.6; }
.b .facts { top: 782px; }
.b .ver { top: 946px; }
.facts b { color: #fff; }
.ver { position: absolute; left: 100px; top: 930px; font: 700 30px "JetBrains Mono"; color: #fff; background: var(--navy); padding: 6px 18px; }
</style>
</head>
<body>
<div class="cv a" id="cv-a"></div>
<div class="cv b" id="cv-b"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
const THEMES = {
  a: { t1side: '#193145', t2side: '#0f2130', face: ['#ffffff', '#cfe0ee', '#699eca'], back: ['#e7eae8', '#b9cfe2', '#8fb0cc'], edge: '#193145', shadow: '#0f2130' },
  b: { t1side: '#1f4560', t2side: '#264d6d', face: ['#ffffff', '#b9cfe2', '#8fb0cc'], back: ['#eef4fa', '#b9cfe2', '#8fb0cc'], edge: '#193145', shadow: '#193145' },
};
function build(key) {
  const th = THEMES[key], cv = document.getElementById('cv-' + key);
  cv.innerHTML = `
  <svg class="full" width="1920" height="1080"><defs>
    <filter id="grain-${key}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer></filter>
    <pattern id="grid-${key}" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/></pattern>
    <filter id="paper-${key}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComposite in="SourceGraphic" in2="g" operator="arithmetic" k1="0" k2="1" k3="0.10" k4="-0.05"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid-${key})"/><rect width="1920" height="1080" filter="url(#grain-${key})" opacity="0.55"/></svg>
  <svg class="full" width="1920" height="1080"><g filter="url(#paper-${key})" class="art"></g></svg>
  <div class="part">PART 3</div>
  <div class="q">一个数据库引擎是如何实现的？</div>
  <div class="t1">学院派的正统</div>
  <div class="t2">PostgreSQL</div>
  <div class="facts">表是一个堆，<b>8 KB 一页</b><br>改一行，页里<b>多写一个新版本</b></div>
  <div class="ver">PostgreSQL 18.6</div>`;
  const art = cv.querySelector('.art');
  // 大字的立体侧面：逐像素往右下错开，不加模糊（字面保持清楚）
  const deep = (el, depth, color) => { const sh = []; for (let i = 1; i <= depth; i++) sh.push(`${i}px ${i}px 0 ${color}`); sh.push(`${depth + 6}px ${depth + 10}px 14px rgba(13,26,36,.35)`); el.style.textShadow = sh.join(','); };
  deep(cv.querySelector('.t1'), 7, th.t1side);
  const t2 = cv.querySelector('.t2');
  const P = (ox, oy) => (x, y, z) => [ox + (x - y) * C30, oy + (x + y) * S30 - z];
  const poly = (pts, fill, stroke, sw = 2, extra = {}) => { const e = document.createElementNS(NS, 'polygon'); e.setAttribute('points', pts.map((p) => p.join(',')).join(' ')); e.setAttribute('fill', fill); if (stroke) { e.setAttribute('stroke', stroke); e.setAttribute('stroke-width', sw); e.setAttribute('stroke-linejoin', 'round'); } for (const k in extra) e.setAttribute(k, extra[k]); art.appendChild(e); return e; };
  const line = (a, b, stroke, sw, dash) => { const e = document.createElementNS(NS, 'line'); e.setAttribute('x1', a[0]); e.setAttribute('y1', a[1]); e.setAttribute('x2', b[0]); e.setAttribute('y2', b[1]); e.setAttribute('stroke', stroke); e.setAttribute('stroke-width', sw); e.setAttribute('stroke-linecap', 'round'); if (dash) e.setAttribute('stroke-dasharray', dash); art.appendChild(e); };
  const text = (x, y, s, size, fill, family = 'JetBrains Mono') => { const e = document.createElementNS(NS, 'text'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('fill', fill); e.setAttribute('font-size', size); e.setAttribute('font-weight', 700); e.setAttribute('font-family', family); e.textContent = s; art.appendChild(e); };
  const box = (p, x, y, z, w, d, h, [top, right, left]) => {
    const v = (a, b, c) => p(x + a, y + b, z + c);
    poly([v(0, d, 0), v(w, d, 0), v(w, d, h), v(0, d, h)], left, th.edge, 2);
    poly([v(w, 0, 0), v(w, d, 0), v(w, d, h), v(w, 0, h)], right, th.edge, 2);
    poly([v(0, 0, h), v(w, 0, h), v(w, d, h), v(0, d, h)], top, th.edge, 2);
  };
  if (key === 'b') {
    // 白板：贴着「PostgreSQL」的字框，往右下伸出厚度（两个侧面），底下一块平涂的影子；字面写 Pg 蓝，侧面深蓝
    const r = t2.getBoundingClientRect(), c = cv.getBoundingClientRect();
    const x0 = r.left - c.left - 40, y0 = r.top - c.top + 12, x1 = r.right - c.left + 36, y1 = r.bottom - c.top - 6, D = 16;
    poly([[x0 + D + 10, y1 + D + 16], [x1 + D + 10, y1 + D + 16], [x1 + D + 10, y0 + D + 16]], th.shadow, null, 0, { opacity: 0.4 });
    poly([[x0, y1], [x1, y1], [x1 + D, y1 + D], [x0 + D, y1 + D]], '#8fb0cc', th.edge, 2);
    poly([[x1, y0], [x1 + D, y0 + D], [x1 + D, y1 + D], [x1, y1]], '#b9cfe2', th.edge, 2);
    poly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], '#ffffff', th.edge, 2);
    deep(t2, 5, th.t2side);
  } else {
    deep(t2, 9, th.t2side);
  }
  // 地上的影子与一排堆页：页 0 在最前，后面的页沿 x 方向往右上排开
  const p = P(1330, 650), PW = 150, PD = 300, PH = 56, GAP = 30;
  poly([p(-60, 330, -2), p(980, 330, -2), p(980, -40, -2), p(-60, -40, -2)], th.shadow, null, 0, { opacity: 0.35 });
  for (let i = 5; i >= 1; i--) box(p, i * (PW + GAP), 0, 0, PW, PD, PH, th.back);
  box(p, 0, 0, 0, PW, PD, PH, th.face);
  const rows = [{ y: 30, kind: 'live' }, { y: 70, kind: 'live' }, { y: 110, kind: 'dead' }, { y: 150, kind: 'live' }, { y: 190, kind: 'new' }, { y: 230, kind: 'live' }];
  for (const r of rows) {
    const col = r.kind === 'new' ? '#336791' : r.kind === 'dead' ? '#c9d0d6' : '#cfe0ee';
    poly([p(14, r.y, PH), p(PW - 14, r.y, PH), p(PW - 14, r.y + 26, PH), p(14, r.y + 26, PH)], col, th.edge, 1.5);
    if (r.kind === 'dead') for (let k = 0; k < 6; k++) line(p(20 + k * 20, r.y + 2, PH), p(36 + k * 20, r.y + 24, PH), '#8a949c', 2);
  }
  const dPt = p(PW, 123, PH), nPt = p(PW, 203, PH), nTo = p(-10, 330, 0);
  line([dPt[0] + 6, dPt[1]], [dPt[0] + 120, dPt[1] - 60], '#ffffff', 2.5);
  text(dPt[0] + 128, dPt[1] - 66, 'xmax ≠ 0  旧版本', 30, '#ffffff', 'Noto Sans SC');
  line([nPt[0] - 70, nPt[1] + 20], [nTo[0] - 40, nTo[1] + 60], '#ffffff', 2.5);
  text(nTo[0] - 200, nTo[1] + 104, '新版本', 30, '#ffffff', 'Noto Sans SC');
  const pl = p(0, PD, 0); text(pl[0] - 118, pl[1] + 14, '页 0', 28, '#cfe0ee', 'Noto Sans SC');   // 放在页 0 左角外，避开「新版本」的引线
  // 上方的小索引树：根与三片叶子；一根虚线从叶子落到页 0 的新版本（ctid）
  const pt = P(1240, 250);
  box(pt, 120, 0, 120, 140, 70, 26, th.face);
  [0, 190, 380].forEach((x) => box(pt, x, 150, 20, 110, 60, 22, th.face));
  const rootB = pt(190, 70, 120);
  [0, 190, 380].forEach((x) => line(rootB, pt(x + 55, 150, 42), '#ffffff', 3));
  const from = pt(55, 210, 20), to = p(PW / 2, 203, PH);
  line(from, to, '#ffffff', 3.5, '10 8');
  text((from[0] + to[0]) / 2 + 18, (from[1] + to[1]) / 2 + 10, 'ctid', 32, '#ffffff');
  text(pt(120, 0, 160)[0] - 10, pt(120, 0, 160)[1] - 16, '索引', 28, '#cfe0ee', 'Noto Sans SC');
}
// 先画一遍让网页字体开始加载；字体到齐后重画一遍，白板按真实字宽量
build('a'); build('b');
document.fonts.ready.then(() => { build('a'); build('b'); });
</script>
</body>
</html>
