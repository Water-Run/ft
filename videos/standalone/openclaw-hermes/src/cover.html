<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套视觉：墨黑底；珊瑚红的名字与像素龙虾属于 OpenClaw，三段金色的像素字属于 Hermes Agent；「实现」反白。
     封面单独设计，不用视频截帧；缩到 360 像素宽仍要读得清主标题；底部约 15% 不放文字（只有一排消息方块）。 */
  :root { --paper: #ece7da; --ink: #0b0e14; --claw: #ff4f40; --herm: #ffd700; --dimi: #8f939c; }
  html, body, #stage { width: var(--W); height: var(--H); margin: 0; }
  .r169 { --W: 1920px; --H: 1080px; --M: 120px; }
  .r43 { --W: 1600px; --H: 1200px; --M: 100px; }
  #stage { position: relative; background: var(--ink); color: var(--paper); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .kicker { position: absolute; left: var(--M); top: 84px; font: 500 42px "Mono", "Sans SC"; color: var(--dimi); white-space: nowrap; }
  .t1 { position: absolute; left: calc(var(--M) - 8px); font-weight: 900; letter-spacing: -.045em; line-height: 1; color: var(--claw); white-space: nowrap; }
  .r169 .t1 { top: 176px; font-size: 176px; } .r43 .t1 { top: 190px; font-size: 164px; }
  .t3 { position: absolute; left: calc(var(--M) - 4px); font-family: "Sans SC", "Inter"; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; color: var(--paper); white-space: nowrap; }
  .r169 .t3 { top: 618px; font-size: 170px; } .r43 .t3 { top: 640px; font-size: 160px; }
  .en.r169 .t3 { font-size: 104px; top: 640px; } .en.r43 .t3 { font-size: 92px; top: 660px; }
  .t3 b { background: var(--paper); color: var(--ink); padding: 0 .12em; margin-left: .1em; font-weight: 900; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div class="kicker"></div>
  <div class="t1">OpenClaw,</div>
  <div class="t3"></div>
  <svg id="art" width="4" height="4"></svg>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', r43 = q.get('r') === '43';
  document.documentElement.className = (r43 ? 'r43' : 'r169') + ' ' + lang;
  document.body.className = document.documentElement.className;
  const TEXT = { zh: { kicker: '网关型智能体 · 两种实现', t3: '和<b>实现</b>' }, en: { kicker: 'Gateway agents · two implementations', t3: 'and Their<b>Implementation</b>' } }[lang];
  document.querySelector('.kicker').textContent = TEXT.kicker;
  document.querySelector('.t3').innerHTML = TEXT.t3;
  const NS = 'http://www.w3.org/2000/svg', art = document.getElementById('art');
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || art).appendChild(e); return e; };
  // 5×7 点阵字，三段色加两层描边回声（照 Hermes Agent 的 banner 重画）：只用到 HERMES
  const BM = { H: ['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'], E: ['XXXXX','X....','X....','XXXX.','X....','X....','XXXXX'], R: ['XXXX.','X...X','X...X','XXXX.','X.X..','X..X.','X...X'], M: ['X...X','XX.XX','X.X.X','X.X.X','X...X','X...X','X...X'], S: ['.XXXX','X....','X....','.XXX.','....X','....X','XXXX.'] };
  const banner = (text, x, y, u) => { const eg = el('g', {}), mg = el('g', {}), band = (j) => (j < 3 ? '#ffd700' : j < 5 ? '#ffbf00' : '#cd7f32'); let cx = x;
    for (const ch of text) { BM[ch].forEach((row, j) => { for (let i = 0; i < 5; i++) if (row[i] === 'X') { [1, 2].forEach((k) => el('rect', { x: cx + i * u + k * u * 0.3, y: y + j * u + k * u * 0.3, width: u, height: u, fill: 'none', stroke: '#cd7f32', 'stroke-width': Math.max(1.5, u * 0.08) }, eg)); el('rect', { x: cx + i * u, y: y + j * u, width: u, height: u, fill: band(j) }, mg); } }); cx += 6 * u; } };
  // 像素龙虾：16×16 点阵取自 OpenClaw 仓库的 docs/assets/pixel-lobster.svg（MIT 许可），颜色照原图
  const LOB = { '#3a0a0d': [[1,5,1,3],[2,4,1,1],[2,8,1,1],[3,3,1,1],[3,9,1,1],[4,2,1,1],[4,10,1,1],[5,2,6,1],[11,2,1,1],[12,3,1,1],[12,9,1,1],[13,4,1,1],[13,8,1,1],[14,5,1,3],[5,11,6,1],[4,12,1,1],[11,12,1,1],[3,13,1,1],[12,13,1,1],[5,14,6,1]],
    '#ff4f40': [[5,3,6,1],[4,4,8,1],[3,5,10,1],[3,6,10,1],[3,7,10,1],[4,8,8,1],[5,9,6,1],[5,12,6,1],[6,13,4,1]], '#ff775f': [[1,6,2,1],[2,5,1,1],[2,7,1,1],[13,6,2,1],[13,5,1,1],[13,7,1,1]], '#081016': [[6,5,1,1],[9,5,1,1]], '#f5fbff': [[6,4,1,1],[9,4,1,1]] };
  const lobster = (x, y, u) => { for (const c in LOB) LOB[c].forEach(([a, b, w, h]) => el('rect', { x: x + a * u, y: y + b * u, width: w * u, height: h * u, fill: c })); };
  // 底部一排消息方块：其中一个珊瑚红、一个金色
  const row = (x, y, n, sz, gap, ci, hi) => { for (let i = 0; i < n; i++) el('rect', { x: x + i * (sz + gap), y, width: sz, height: sz, fill: i === ci ? '#ff4f40' : i === hi ? '#ffd700' : '#ece7da' }); };
  if (!r43) { banner('HERMES', 120, 404, 26); lobster(1330, 120, 30); row(120, 944, 26, 40, 28, 7, 15); }
  else { banner('HERMES', 100, 410, 24); lobster(1090, 110, 26); row(100, 1060, 22, 40, 26, 6, 13); }
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('500 40px "Mono"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
