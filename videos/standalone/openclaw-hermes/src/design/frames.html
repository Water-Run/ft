<!doctype html>
<html lang="zh-CN">

<style>

  @font-face { font-family: "Sans SC"; src: url("/fonts/NotoSansSC.ttf"); font-weight: 100 900; }

  svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
</style>

<script>
const Q = new URLSearchParams(location.search), F = (Q.get('f') || 'A1').toUpperCase();

const el = (cls, css, html) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); if (html != null) d.innerHTML = html; S.appendChild(d); return d; };
const svgNS = 'http://www.w3.org/2000/svg';
const sv = () => { const s = document.createElementNS(svgNS, 'svg'); s.setAttribute('viewBox', '0 0 1920 1080'); S.appendChild(s); return s; };
const add = (parent, tag, attrs) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
// 钳形：两片弯刃以同一个铰点开合。hx,hy 铰点；s 比例；open 单片张角（度）；颜色 fill
function claw(parent, hx, hy, s, open, fill) {
  const blade = 'M0,0 C 60,-78 168,-70 232,-12 C 168,-26 84,-18 0,0 Z';
  const g = add(parent, 'g', { transform: `translate(${hx} ${hy}) scale(${s})` });
  add(g, 'path', { d: blade, fill, transform: `rotate(${-open})` });
  add(g, 'path', { d: blade, fill, transform: `scale(1 -1) rotate(${-open})` });
  return g;
}
// 像素翼：向右展开的阶梯条，u 为像素单位
function wing(parent, x, y, u, widths, fill) {
  widths.forEach((w, i) => add(parent, 'rect', { x: x - w * u, y: y + i * u * 1.5, width: w * u, height: u, fill }));
}


// 钳：圆形的掌 + 两片弯刃。open 为单片张角（度）。
function claw2(parent, hx, hy, s, open, fill) {
  const g = add(parent, 'g', { transform: `translate(${hx} ${hy}) scale(${s})` });
  add(g, 'circle', { cx: 0, cy: 0, r: 64, fill });
  add(g, 'path', { d: 'M-10,-60 C 70,-122 196,-100 256,-18 C 198,-50 120,-50 66,-20 Z', fill, transform: `rotate(${-open})` });
  add(g, 'path', { d: 'M-10,60 C 70,122 168,104 216,38 C 170,62 112,58 66,26 Z', fill, transform: `rotate(${open})` });
  return g;
}
// 5×7 像素字：每个像素一个方块。u 为像素边长，gap 为字间距（像素数）
const BM = {
  H: ['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'], E: ['XXXXX','X....','X....','XXXX.','X....','X....','XXXXX'],
  R: ['XXXX.','X...X','X...X','XXXX.','X.X..','X..X.','X...X'], M: ['X...X','XX.XX','X.X.X','X.X.X','X...X','X...X','X...X'],
  S: ['.XXXX','X....','X....','.XXX.','....X','....X','XXXX.'], A: ['.XXX.','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  G: ['.XXXX','X....','X....','X..XX','X...X','X...X','.XXXX'], N: ['X...X','XX..X','X.X.X','X..XX','X...X','X...X','X...X'],
  T: ['XXXXX','..X..','..X..','..X..','..X..','..X..','..X..'], ' ': ['.....','.....','.....','.....','.....','.....','.....'],
};
function pixelText(parent, text, x, y, u, fill, gap = 1) {
  let cx = x;
  for (const ch of text) {
    const rows = BM[ch] || BM[' '];
    rows.forEach((r, j) => [...r].forEach((c, i) => { if (c === 'X') add(parent, 'rect', { x: cx + i * u, y: y + j * u, width: u, height: u, fill }); }));
    cx += (5 + gap) * u;
  }
  return cx - gap * u;
}
const DAY = 86400000, D = (s) => Date.parse(s + 'T00:00:00Z');

const FR = {

  },

    const s = sv(); pixelText(s, 'HERMES', 120, 392, 30, C.herm); pixelText(s, 'AGENT', 120, 640, 30, C.herm);

  },
  // ───── B1 标题：整幅色场 ─────
  B1() {
