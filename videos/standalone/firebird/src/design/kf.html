.h1 { font:600 96px/1.1 "Open Sans","Sans SC"; color:var(--ink); white-space:nowrap; }

.crumb { font:400 28px "Open Sans","Serif SC"; color:var(--soft); white-space:nowrap; }
.crumb u { color:var(--blue); }
.body { font:400 34px/1.5 "Serif SC"; color:#2b2b2b; }
.line { height:2px; background:var(--rule2); }
.cap { position:absolute; left:0; right:0; top:992px; text-align:center; font:500 42px "Sans SC"; color:var(--ink); }
.cap.w { color:#fff; }
.code { background:var(--code); border:2px solid #e0e0dc; font:400 29px/1.42 "Mono"; color:#2a2a2a; padding:26px 32px; white-space:pre; }
.code b { color:var(--blue); font-weight:600; }
.code i { color:#c2410c; font-style:normal; font-weight:600; }
.shadow { position:absolute; background:rgba(40,30,20,.3); filter:blur(16px); }
.lab { position:absolute; font:700 40px "Sans SC"; color:var(--ink); white-space:nowrap; }
.lab.s { font-weight:500; font-size:30px; color:var(--soft); }
.stamp { position:absolute; font:900 120px/1 "Sans SC"; white-space:nowrap; }
.adm { display:flex; align-items:center; }
.adm .ic { width:96px; height:96px; border-radius:50%; background:var(--warn); color:#fff; font:800 74px/96px "Open Sans"; text-align:center; box-shadow:2px 3px 6px rgba(0,0,0,.4); }
.adm .bar { width:3px; height:128px; background:var(--rule2); margin:0 36px; }
.ring { position:absolute; border-radius:50%; }

  for (let i = 1; i <= n; i++) o.push(`${(i * dx).toFixed(1)}px ${(i * dy).toFixed(1)}px 0 rgb(${lerp(A, B, i / n).join(',')})`);
