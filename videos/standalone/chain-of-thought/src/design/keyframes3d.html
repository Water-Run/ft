<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CoT 关键帧 · 草稿纸（立体）</title>
<!-- 视觉 B「草稿纸」的立体版关键帧（静帧），供审片页比较。?f=1|2|3
     策划者 2026-11-07：可以有 3D、背景更白更像论文；随后「配色, 画面之类的不够冷静严谨, 过于花哨, AI味太重」
     「形式服从内容, 服从叙事的基础. 不要故意为炫技而炫技, 而是有质感的在背后承托」。
     做法：白底、墨色与灰色；颜色只表达含义——只有「错」用一种朱红；衬线排版像印出来的论文；
     3D 只给本身有空间含义的东西（三张摊开的纸、固定层数的一摞、越摞越高的草稿），镜头角度平缓；
     画面只放旁白讲到的内容。用 CSS 3D 搭建，不引第三方库；数字取自 research/lab 的回显与 out_03_check.txt。
     1 开场 o9：三次回答摊成三张纸，第三张的最后一步回到第一行的错数。
     2 第 02 章 c7：层数固定的一摞，四块 token 各穿过一次。
     3 第 03 章 r14：思考模式的草稿按位数摞起来。 -->
<style>
@font-face { font-family: "Sans SC"; src: url("/fonts/NotoSansSC.ttf"); font-weight: 100 900; }
@font-face { font-family: "Serif SC"; src: url("/fonts/NotoSerifSC.ttf"); font-weight: 200 900; }
:root { --ink: #1c1c1c; --gray: #707070; --light: #b4b4b4; --line: #dadada; --err: #a5402d; }
html, body { margin: 0; padding: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; position: relative; background: #fff; color: var(--ink); font-family: "Serif SC"; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
.view { position: absolute; inset: 0; perspective: 2800px; }
.world { position: absolute; width: 0; height: 0; transform-style: preserve-3d; }
.p3 { position: absolute; transform-style: preserve-3d; }
.sheet { position: absolute; background: #fff; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.sheet::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18; background-image: var(--grain); }
.shadow { position: absolute; background: rgba(0,0,0,.075); filter: blur(22px); }
.no { font: 400 28px "Serif SC"; color: var(--gray); letter-spacing: .08em; }
.lab { font: 600 32px "Serif SC"; color: var(--ink); }
.rule { position: absolute; height: 1px; background: var(--ink); }
.ln { position: absolute; font: 400 28px "Serif SC"; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.g { color: var(--gray); }
.err { color: var(--err); }
.u { border-bottom: 2px solid currentColor; padding-bottom: 2px; }
.bb { position: absolute; white-space: nowrap; transform-origin: 0 100%; }
.cap { position: absolute; left: 0; right: 0; bottom: 46px; height: 64px; display: flex; align-items: center; justify-content: center; font: 500 40px "Sans SC"; color: #111; text-shadow: 0 0 14px #fff, 0 0 6px #fff, 0 0 2px #fff; }
.tile { position: absolute; transform-style: preserve-3d; }
.tile .top, .tile .fr, .tile .rt { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
.tile .top { font: 400 40px "Serif SC"; color: var(--ink); background: #fff; box-shadow: inset 0 0 0 1px #bdbdbd; }
.tile .fr { background: #ececec; transform-origin: 0 100%; }
.tile .rt { background: #e2e2e2; transform-origin: 100% 0; }
.plane { position: absolute; box-shadow: inset 0 0 0 1px rgba(28,28,28,.2); background: rgba(255,255,255,.06); }
.path { position: absolute; transform-origin: 50% 100%; background: rgba(28,28,28,.75); }
.ream { position: absolute; background: #fff; box-shadow: 0 0 0 1px #d4d4d4; }
</style>
</head>
<body>
<div id="stage"><div class="view"><div class="world" id="W"></div></div></div>
<script>
const ST = document.getElementById('stage'), W = document.getElementById('W');
const F = +(new URLSearchParams(location.search).get('f') || 1);
// 纸的纤维：固定种子的极淡噪声
const grain = (seed, freq) => `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' seed='${seed}' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0.14 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>`)}")`;
document.documentElement.style.setProperty('--grain', grain(7, 0.9));
const el = (parent, cls, css = '', html = '') => { const e = document.createElement('div'); e.className = cls; e.style.cssText = css; e.innerHTML = html; parent.appendChild(e); return e; };
const world = (x, y, rx, rz, k = 1) => { W.style.left = x + 'px'; W.style.top = y + 'px'; W.style.transform = `scale3d(${k}, ${k}, ${k}) rotateX(${rx}deg) rotateZ(${rz}deg)`; return { rx, rz }; };
// 面向镜头的标签：抵消 world 的旋转
const board = (cam, html, x, y, z, dx = 0) => el(W, 'bb', `transform: translate3d(${x}px, ${y}px, ${z}px) rotateZ(${-cam.rz}deg) rotateX(${-cam.rx}deg) translateX(${dx}px);`, html);
const tile = (parent, txt, x, y, w, h, d) => {
  const t = el(parent, 'tile', `left:${x}px; top:${y}px; width:${w}px; height:${h}px;`);
  el(t, 'fr', `width:${w}px; height:${d}px; top:${h - d}px; transform: rotateX(-90deg);`);
  el(t, 'rt', `width:${d}px; height:${h}px; left:${w - d}px; transform: rotateY(90deg);`);
  el(t, 'top', `width:${w}px; height:${h}px; transform: translateZ(${d}px);`, txt);
  return t;
};

if (F === 1) {
  world(940, 500, 26, -2, .92);
  const S = [
    { x: -900, y: -340, z: 0, no: '第一次', lab: '只报答案' },
    { x: -290, y: -340, z: 0, no: '第二次', lab: '先写过程，再给答案' },
    { x: 320, y: -340, z: 40, no: '第三次', lab: '先写答案，再补过程', w: 620 },
  ];
  S.forEach((s, i) => {
    const w = s.w || 560, h = 700;
    el(W, 'shadow', `left:${s.x + 18}px; top:${s.y + 26}px; width:${w - 10}px; height:${h - 10}px; opacity:${s.z ? 1 : .7};`);
    const sh = el(W, 'sheet p3', `left:${s.x}px; top:${s.y}px; width:${w}px; height:${h}px; transform: translateZ(${s.z}px);`);
    el(sh, 'no', 'position:absolute; left:44px; top:34px;', s.no);
    el(sh, 'lab', 'position:absolute; left:44px; top:70px;', s.lab);
    el(sh, 'rule', `left:44px; top:128px; width:${w - 88}px;`);
    if (i === 0) {
      el(sh, 'ln g', 'left:44px; top:168px;', '25992 × 92138 =');
      el(sh, 'ln', 'left:44px; top:226px; font-size:56px; letter-spacing:.01em;', '2394<span class="err u">73</span>0896');
      el(sh, 'ln g', 'left:44px; top:328px; font-size:26px;', '正确　2394<span style="color:#1c1c1c">85</span>0896');
    } else if (i === 1) {
      ['92138 = 92000 + 138', '25992 × 92000 = 2,391,264,000', '25992 × 138 = 3,586,896', '2,391,264,000 + 3,586,896', '　= 2,394,850,896'].forEach((t, k) => el(sh, 'ln', `left:44px; top:${160 + k * 58}px; font-size:26px;`, t));
      el(sh, 'rule', `left:44px; top:478px; width:${w - 88}px; background:#dadada;`);
      el(sh, 'ln', 'left:44px; top:500px; font-size:36px;', '答案　<span class="u">2394850896</span>');
    } else {
      el(sh, 'ln', 'left:44px; top:158px; font-size:36px;', '答案　<span class="err">2394841296</span>');
      ['25992 × 92138', '= 25992 × (92000 + 138)', '= 25992 × 92000 + 25992 × 138', '= 2391264000 + 3586896'].forEach((t, k) => el(sh, 'ln', `left:44px; top:${238 + k * 58}px; font-size:27px;`, t));
      el(sh, 'ln', 'left:44px; top:470px; font-size:36px;', '= <span class="err u">2394841296</span>');
      const svg = el(sh, '', `position:absolute; left:0; top:0; width:${w}px; height:${h}px;`);
      svg.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0"><path d="M440 498 C 560 470, 575 230, 452 186" fill="none" stroke="#a5402d" stroke-width="2"/><path d="M466 176 l -16 9 l 14 12" fill="none" stroke="#a5402d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
    }
  });
  el(ST, 'cap', '', '最后一步加完，得出的正好是这一次开头写下的那个错数');
}

if (F === 2) {
  const cam = world(920, 640, 56, -30, .72);
  el(W, 'shadow', 'left:-450px; top:-170px; width:900px; height:360px; opacity:.6;');
  el(W, 'sheet p3', 'left:-470px; top:-190px; width:940px; height:380px;');
  const xs = [-370, -175, 20, 215];
  ['239', '473', '089', '6'].forEach((t, k) => tile(W, t, xs[k], -25, 140, 96, 22));
  // 层数固定的一摞：只画边线，像图纸
  const N = 32, gap = 13, z0 = 110, H = z0 + N * gap + 30;
  for (let i = 0; i < N; i++) el(W, 'plane', `left:-480px; top:-200px; width:960px; height:400px; transform: translateZ(${z0 + i * gap}px); ${i === N - 1 ? 'box-shadow: inset 0 0 0 1.5px rgba(28,28,28,.55);' : ''}`);
  // 每块 token 只从下到上穿过一次
  xs.forEach((x) => el(W, 'path', `left:${x + 69}px; top:${23 - H}px; width:2px; height:${H}px; transform: rotateX(-90deg);`));
  board(cam, '<span style="font:400 48px \'Serif SC\';color:#1c1c1c">96 层</span>', 520, 210, z0 + N * gap - 10);
  board(cam, '<span style="font:400 32px \'Serif SC\';color:#707070">每写一块，都只经过这些层</span>', 520, 210, z0 + N * gap - 110);
  board(cam, '<span style="font:400 28px \'Serif SC\';color:#707070">只报答案：一共 4 块</span>', -470, 260, 0);
  el(ST, 'cap', '', '只让它报答案，就等于要它在写这四块的时候');
}

if (F === 3) {
  const cam = world(930, 610, 54, -20, .74);
  const D = [[3, 93.0, '221 × 427'], [4, 165.6, '7508 × 5120'], [5, 261.2, '25992 × 92138'], [6, 412.2, '903946 × 966305'], [7, 550.2, '1003589 × 8570388']];
  D.forEach(([n, tok, prob], k) => {
    // 每摞顶上是该位数的一道真题（L2：n3-00、n4-00、n5-03、n6-00、n7-00）；高度按平均思考 token，每 5 个一张
    const x = -860 + k * 340, y = -150, sheets = Math.round(tok / 5), h = 3;
    el(W, 'shadow', `left:${x + 16}px; top:${y + 24}px; width:255px; height:315px; opacity:.7;`);
    for (let i = 0; i < sheets; i++) el(W, 'ream', `left:${x + ((i * 37) % 5) - 2}px; top:${y + ((i * 53) % 3) - 1}px; width:270px; height:330px; transform: translateZ(${i * h}px);`);
    const topZ = sheets * h;
    const top = el(W, 'sheet p3', `left:${x}px; top:${y}px; width:270px; height:330px; transform: translateZ(${topZ + 2}px);`);
    el(top, 'ln', `left:22px; top:262px; font-size:${prob.length > 13 ? 22 : 27}px;`, prob);
    board(cam, `<div style="text-align:center;width:300px"><div style="font:400 50px 'Serif SC';color:#1c1c1c">${Math.round(tok)}</div><div style="font:400 31px 'Serif SC';color:#707070">${n} 位数</div></div>`, x + 135, y + 60, topZ + 230, -150);
  });
  board(cam, '<span style="font:400 28px \'Serif SC\';color:#707070">平均思考 token　·　DeepSeek 思考模式，每种位数 5 题，全部答对</span>', -880, 250, 0);
  el(ST, 'cap', '', '二十五道全做对了；位数越多，它想得越久');
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
