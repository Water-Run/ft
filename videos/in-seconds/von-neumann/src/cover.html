<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套「技术手册」：米色方格纸、墨线方框图、穿孔纸带、红铅笔。秒数最醒目；方框图就是正片里贯穿的那张图。
     4:3 是重新排布（字在上、图在下），不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { position: relative; overflow: hidden; color: var(--ink);
    background: linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 0 / 40px 40px, var(--paper); }
  #stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, transparent 55%, color-mix(in srgb, var(--vign) 20%, transparent)); }
  .abs { position: absolute; white-space: nowrap; }
  .fig { font: 500 30px "Mono"; letter-spacing: .1em; color: var(--soft); }
  .ttl { font: 900 150px "Serif SC"; line-height: 1.04; }
  .sec { font: 700 330px "Mono"; letter-spacing: -.05em; line-height: .9; color: var(--red); }
  .unit { font: 900 84px "Serif SC"; color: var(--red); }
  .sub { font: 600 44px "Serif SC"; color: var(--soft); }
  svg.d { position: absolute; overflow: visible; }
  .r43 .ttl { font-size: 136px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search), R = q.get('r') === '43' ? '43' : '169', LANG = q.get('lang') || 'zh';
document.documentElement.className = 'r' + R + ' ' + LANG;
const S = document.getElementById('stage');
const T = LANG === 'zh' ? { fig: '图 1 · 存储程序计算机 · 1945', ttl: '冯·诺伊曼<br>架构', unit: '秒', sub: '不改电线，换着干活' } : { fig: 'FIG. 1 · STORED-PROGRAM COMPUTER · 1945', ttl: 'von Neumann<br>Architecture', unit: 's', sub: 'Same wires, different jobs' };
const el = (cls, html, x, y) => { const e = document.createElement('div'); e.className = 'abs ' + cls; e.innerHTML = html; e.style.left = x + 'px'; e.style.top = y + 'px'; S.appendChild(e); return e; };
// 方框图：控制器、运算器在左，九个存储格在右，中间一条通道，一段纸带正在通道里
function diagram(x, y, k) {
  const NS = 'http://www.w3.org/2000/svg', css = getComputedStyle(document.documentElement);
  const c = (n) => css.getPropertyValue(n).trim();
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'd'); s.style.left = x + 'px'; s.style.top = y + 'px';
  s.setAttribute('width', 900 * k); s.setAttribute('height', 560 * k); s.setAttribute('viewBox', '0 0 900 560'); S.appendChild(s);
  const add = (tag, a) => { const e = document.createElementNS(NS, tag); for (const n in a) e.setAttribute(n, a[n]); s.appendChild(e); return e; };
  const box = (x0, y0, w, h, label) => { add('rect', { x: x0, y: y0, width: w, height: h, fill: c('--paper'), stroke: c('--ink'), 'stroke-width': 5 }); const t = add('text', { x: x0 + 20, y: y0 + 52, fill: c('--ink'), 'font-family': 'Serif SC', 'font-weight': 900, 'font-size': 40 }); t.textContent = label; };
  box(0, 0, 330, 250, LANG === 'zh' ? '控制器' : 'Control'); box(0, 290, 330, 250, LANG === 'zh' ? '运算器' : 'Arithmetic'); box(560, 0, 340, 540, LANG === 'zh' ? '存储器' : 'Memory');
  add('path', { d: 'M330,250 L560,250 M330,290 L560,290', stroke: c('--ink'), 'stroke-width': 5, fill: 'none' });
  for (let i = 0; i < 8; i++) {
    const yy = 82 + i * 56, ins = i < 4;
    add('rect', { x: 580, y: yy + 8, width: 8, height: 38, fill: ins ? c('--blue') : c('--ochre') });
    const t = add('text', { x: 602, y: yy + 38, fill: ins ? c('--blue') : c('--ochre'), 'font-family': 'Mono', 'font-weight': 600, 'font-size': 30, 'letter-spacing': 3 });
    t.textContent = ['0001 1000', '0001 1001', '0011 0111', '1000 0001', '0000 0000', '0000 1000', '0000 0101', '0000 0011'][i];
    add('path', { d: `M560,${yy + 54} L900,${yy + 54}`, stroke: c('--ink'), 'stroke-opacity': 0.25, 'stroke-width': 2 });
  }
  add('path', { d: 'M548,108 L520,92 L520,124 Z', fill: c('--red') });
  // 通道里的纸带
  add('rect', { x: 372, y: 248, width: 150, height: 44, fill: c('--paper2'), stroke: c('--tapeedge'), 'stroke-width': 2 });
  add('rect', { x: 372, y: 248, width: 8, height: 44, fill: c('--blue') });
  [0, 0, 0, 1, 1, 0, 0, 0].forEach((b, i) => add('circle', { cx: 396 + i * 16, cy: 262, r: 6, fill: b ? c('--ink') : 'none', stroke: c('--ink'), 'stroke-opacity': b ? 1 : 0.3, 'stroke-width': 2 }));
  // 红铅笔圈住通道
  add('ellipse', { cx: 445, cy: 270, rx: 140, ry: 52, fill: 'none', stroke: c('--red'), 'stroke-width': 6, transform: 'rotate(-4 445 270)' });
}
if (R === '169') {
  el('fig', T.fig, 96, 70);
  el('ttl', T.ttl, 90, 118);
  el('sec', '128', 96, 470); el('unit', T.unit, 668, 640);
  diagram(940, 120, 0.98);
  el('sub', T.sub, 96, 790);
} else {
  el('fig', T.fig, 90, 64);
  el('ttl', T.ttl, 84, 110);
  el('sec', '128', 1010 - 3 * 168 + 400, 120);
  el('unit', T.unit, 1350, 410);
  diagram(160, 440, 1.05);
}
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
