<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套「九十年代桌面」：青色桌面上一个「关于 IPv4」窗口——点阵大字 IPv4、醒目的 100 秒、正片里的四格地址框与这个地址的 32 位。
     4:3 是重新排布，不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  @font-face { font-family: "Pixel"; src: url("/fonts/VT323.ttf"); }
  :root { --teal: #008080; --silver: #C0C0C0; --white: #FFFFFF; --dgray: #808080; --black: #000000; --navy: #000080; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--teal); overflow: hidden; font-family: "Sans SC"; }
  .abs { position: absolute; white-space: nowrap; }
  .win { position: absolute; border: 5px solid; border-color: var(--white) var(--black) var(--black) var(--white); background: var(--silver); }
  .win::after { content: ""; position: absolute; inset: 0; border: 4px solid; border-color: var(--silver) var(--dgray) var(--dgray) var(--silver); pointer-events: none; }
  .tb { position: absolute; left: 9px; right: 9px; top: 9px; height: 76px; background: var(--navy); color: var(--white); font: 700 46px/76px "Sans SC"; padding-left: 24px; }
  .x { position: absolute; right: 12px; top: 10px; width: 60px; height: 54px; background: var(--silver); border: 4px solid; border-color: var(--white) var(--black) var(--black) var(--white); color: var(--black); font: 700 40px/44px "Inter"; text-align: center; }
  .ip { font: 400 440px/1 "Pixel"; color: var(--navy); }
  .num { font: 400 360px/1 "Pixel"; color: var(--navy); }
  .su { font: 900 140px/1 "Sans SC"; color: var(--black); }
  .box { display: flex; align-items: center; gap: 8px; }
  .box span.o { width: 156px; height: 104px; background: var(--white); border: 5px solid; border-color: var(--dgray) var(--white) var(--white) var(--dgray); font: 500 72px/94px "Inter"; text-align: center; }
  .box span.d { font: 700 72px/1 "Inter"; }
  .bits { display: flex; gap: 6px; }
  .bits i { width: 36px; height: 52px; border: 4px solid; border-color: var(--dgray) var(--white) var(--white) var(--dgray); background: var(--white); }
  .bits i.on { background: var(--navy); border-color: var(--navy); }
  .bits i.g { margin-left: 20px; }
  /* 16:9 */
  .r169 .win { left: 60px; top: 50px; width: 1800px; height: 846px; }
  .r169 .ip { left: 110px; top: 120px; }
  .r169 .num { left: 920px; top: 150px; }
  .r169 .su { left: 1360px; top: 300px; }
  .r169 .box { left: 116px; top: 540px; }
  .r169 .sub { left: 980px; top: 556px; font: 700 64px/1.3 "Sans SC"; color: var(--black); }
  .r169 .bits { left: 116px; top: 730px; }
  /* 4:3 */
  .r43 .win { left: 50px; top: 50px; width: 1500px; height: 960px; }
  .r43 .ip { left: 100px; top: 120px; font-size: 420px; }
  .r43 .num { left: 100px; top: 480px; font-size: 300px; }
  .r43 .su { left: 480px; top: 610px; font-size: 130px; }
  .r43 .box { left: 106px; top: 790px; }
  .r43 .bits { display: none; }
  .r43 .sub { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="win"><div class="tb"></div><div class="x">×</div></div>
  <div class="abs ip">IPv4</div>
  <div class="abs num">100</div>
  <div class="abs su"></div>
  <div class="abs box"></div>
  <div class="abs bits"></div>
  <div class="abs sub"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const TEXT = { zh: { tb: '关于 IPv4', su: '秒速通', sub: '互联网协议<br>第 4 版 · 1981' }, en: { tb: 'About IPv4', su: 'seconds', sub: 'Internet Protocol<br>version 4 · 1981' } }[lang] || { tb: '关于 IPv4', su: '秒速通', sub: '' };
  document.querySelector('.tb').textContent = TEXT.tb;
  document.querySelector('.su').textContent = TEXT.su;
  document.querySelector('.sub').innerHTML = TEXT.sub;
  const oct = [192, 168, 1, 10];
  document.querySelector('.box').innerHTML = oct.map((v) => `<span class="o">${v}</span>`).join('<span class="d">.</span>');
  const bits = oct.map((v) => v.toString(2).padStart(8, '0')).join('');
  document.querySelector('.bits').innerHTML = [...bits].map((b, i) => `<i class="${b === '1' ? 'on' : ''}${i && i % 8 === 0 ? ' g' : ''}"></i>`).join('');
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('400 40px "Pixel"', sample), document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('700 40px "Sans SC"', sample), document.fonts.load('500 40px "Inter"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
