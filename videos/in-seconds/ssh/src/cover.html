<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  :root {
    --ink: #070807; --ac: #74ff9a; --paper: #c4b8a4; --chassis: #2c312c;
    --olive: #3e4a32; --amber: #ffb23e; --orange: #e07a2f; --rust: #8c4a32; --dim: #1e6b3a;
  }
  html, body, #stage { width: var(--W); height: var(--H); background: var(--ink); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { position: relative; overflow: hidden; color: var(--ac); font-family: "Pixel", "Sans SC"; }
  .abs { position: absolute; white-space: nowrap; }
  .bezel { background: var(--chassis); }
  .panel { background: var(--olive); }
  .plastic { background: var(--paper); color: var(--ink); }
  .kicker { font: 40px "Pixel", "Sans SC"; letter-spacing: .14em; color: var(--ink); }
  .big { font: 220px "Pixel"; line-height: 1; letter-spacing: .02em; }
  .ttl { font: 64px "Sans SC"; line-height: 1.15; color: var(--ac); }
  .en .ttl { font-family: "Pixel", "Sans SC"; letter-spacing: .04em; }
  .code { font: 36px "Pixel"; letter-spacing: .16em; color: var(--amber); }
  .cell { position: absolute; width: 22px; height: 36px; background: var(--dim); }
  .cell.on { background: var(--ac); }
  .stripe { position: absolute; height: 12px; }
  .stripe i { display: block; float: left; width: 33.34%; height: 12px; }
  .stripe i:nth-child(1) { background: var(--amber); }
  .stripe i:nth-child(2) { background: var(--orange); }
  .stripe i:nth-child(3) { background: var(--rust); }
  .r169 .bezel { left: 70px; top: 70px; width: 1780px; height: 860px; }
  .r169 .panel { left: 96px; top: 96px; width: 1728px; height: 760px; }
  .r169 .plastic { left: 128px; top: 128px; width: 420px; height: 64px; }
  .r169 .kicker { left: 148px; top: 136px; }
  .r169 .big { left: 128px; top: 240px; }
  .r169 .ttl { left: 128px; top: 520px; }
  .r169 .code { left: 128px; top: 760px; }
  .r169 .stripe { left: 128px; top: 820px; width: 360px; }
  .r43 .bezel { left: 48px; top: 48px; width: 1504px; height: 980px; }
  .r43 .panel { left: 72px; top: 72px; width: 1456px; height: 860px; }
  .r43 .plastic { left: 100px; top: 100px; width: 420px; height: 64px; }
  .r43 .kicker { left: 120px; top: 108px; }
  .r43 .big { left: 100px; top: 210px; font-size: 200px; }
  .r43 .ttl { left: 100px; top: 480px; font-size: 56px; }
  .r43 .code { left: 100px; top: 760px; }
  .r43 .stripe { left: 100px; top: 840px; width: 360px; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs bezel"></div>
  <div class="abs panel"></div>
  <div class="abs plastic"></div>
  <div class="abs kicker">SYS</div>
  <div class="abs big">SSH</div>
  <div class="abs ttl"></div>
  <div class="abs code">256 SEC</div>
  <div class="abs stripe"><i></i><i></i><i></i></div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const title = {
    zh: '256 秒搞懂 SSH',
    en: 'SSH in 256 Seconds',
  }[lang];
  document.querySelector('.ttl').textContent = title;
  const stage = document.getElementById('stage');
  const x0 = wide ? 1180 : 980, y0 = wide ? 280 : 260;
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement('div');
    cell.className = 'abs cell' + (i < 10 ? ' on' : '');
    cell.style.left = (x0 + (i % 8) * 30) + 'px';
    cell.style.top = (y0 + Math.floor(i / 8) * 48) + 'px';
    stage.appendChild(cell);
  }
  const sample = stage.textContent;
  Promise.all([
    document.fonts.load('40px "Pixel"', 'SSH'),
    document.fonts.load('64px "Sans SC"', sample),
    document.fonts.load('36px "Mono"', '256'),
  ]).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
