<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套「应答机」视觉：米色面板、墨色屏、琥珀色的点阵大字，取正片片名卡的构图重新排版。
     4:3 是重新排布，不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。点阵数字画成 SVG 方块（封面里的 canvas 截出来会是空的）。 */
  @font-face { font-family: "Pixel"; src: url("/fonts/VT323.ttf"); }
  :root { --ink: #14120e; --case: #e4dac4; --case2: #cbbfa3; --amber: #ffb52e; --red: #ef4b28; --dima: #a8874f; --mute: #5f584b; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--case); color: var(--ink); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  .scr { background: var(--ink); }
  .st { font: 600 44px "Mono"; color: var(--amber); }
  .st b { background: var(--amber); color: var(--ink); font-weight: 600; padding: 0 8px; margin: 0 -8px; }
  .sec { font: 900 104px "Sans SC", "Inter"; color: var(--amber); line-height: 1; }
  .k1 { font: 700 58px "Sans SC", "Inter"; color: var(--mute); }
  .t1 { font: 900 210px/1 "Inter"; letter-spacing: -.02em; }
  .t2 { font: 900 216px/1 "Sans SC"; }
  .en .t2 { font: 900 150px/1 "Inter"; letter-spacing: -.01em; }
  .cab i { position: absolute; left: 0; right: 0; height: 10px; }
  .chips { display: flex; gap: 16px; }
  .chips b { display: flex; align-items: center; justify-content: center; width: 132px; height: 92px; background: var(--ink); color: var(--amber); font: 400 86px/1 "Pixel"; }
  .chips b.e { color: var(--red); }
  svg { position: absolute; overflow: visible; }
  /* 16:9 */
  .r169 .scr { left: 90px; top: 90px; width: 860px; height: 730px; }
  .r169 .st { left: 150px; top: 726px; }
  .r169 .k1 { left: 1010px; top: 92px; }
  .r169 .t1 { left: 1000px; top: 176px; }
  .r169 .t2 { left: 996px; top: 404px; }
  .r169.en .t2 { top: 400px; }
  .r169 .cab { left: 1010px; top: 668px; width: 760px; height: 34px; }
  .r169 .chips { left: 1010px; top: 728px; }
  .r169.en .cab { top: 728px; }
  .r169.en .chips { top: 790px; }
  /* 4:3 */
  .r43 .scr { left: 70px; top: 70px; width: 900px; height: 600px; }
  .r43 .st { left: 126px; top: 590px; font-size: 40px; }
  .r43 .k1 { left: 1010px; top: 80px; }
  .r43 .t1 { left: 1004px; top: 160px; font-size: 168px; }
  .r43 .t2 { left: 64px; top: 690px; font-size: 200px; }
  .r43.en .t2 { font-size: 150px; top: 720px; }
  .r43 .cab { left: 1010px; top: 400px; width: 520px; height: 34px; }
  .r43 .chips { left: 70px; top: 930px; }
  .r43 .chips b { width: 150px; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs scr"></div>
  <div class="abs st">HTTP/1.1 <b>404</b> Not Found</div>
  <div class="abs k1"></div>
  <div class="abs t1">HTTP</div>
  <div class="abs t2"></div>
  <div class="abs cab"><i style="top:0;background:var(--amber)"></i><i style="top:12px;background:var(--ink)"></i><i style="top:24px;background:var(--red)"></i></div>
  <div class="abs chips"><b>1xx</b><b>2xx</b><b>3xx</b><b class="e">4xx</b><b class="e">5xx</b></div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const TEXT = { zh: { k1: '了解', t2: '状态码', sec: '秒' }, en: { k1: 'in 96 seconds', t2: 'Status<br>Codes', sec: 's' } }[lang];
  document.querySelector('.k1').textContent = TEXT.k1;
  document.querySelector('.t2').innerHTML = TEXT.t2;
  if (!wide && lang === 'en') document.querySelector('.t2').innerHTML = 'Status Codes';
  // 点阵的「96」：5×7 方点，和正片片名卡同一套字形
  const DOT = { 9: ['01110', '10001', '10001', '01111', '00001', '00010', '01100'], 6: ['00110', '01000', '10000', '11110', '10001', '10001', '01110'] };
  const NS = 'http://www.w3.org/2000/svg', AMBER = '#ffb52e';
  const [x0, y0, cell] = wide ? [150, 180, 56] : [126, 120, 50];
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', 10); s.setAttribute('height', 10); s.style.left = x0 + 'px'; s.style.top = y0 + 'px';
  ['9', '6'].forEach((ch, i) => DOT[ch].forEach((row, r) => [...row].forEach((b, c) => {
    if (b !== '1') return;
    const e = document.createElementNS(NS, 'rect');
    for (const [k, v] of Object.entries({ x: i * 6 * cell + c * cell, y: r * cell, width: cell - 8, height: cell - 8, fill: AMBER })) e.setAttribute(k, v);
    s.appendChild(e);
  })));
  document.getElementById('stage').appendChild(s);
  const sec = document.createElement('div'); sec.className = 'abs sec'; sec.textContent = TEXT.sec;
  sec.style.left = (x0 + 11 * cell + 34) + 'px'; sec.style.top = (y0 + 7 * cell - 104) + 'px';
  document.getElementById('stage').appendChild(sec);
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('700 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('600 40px "Mono"', sample), document.fonts.load('400 40px "Pixel"', '1xx')])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
