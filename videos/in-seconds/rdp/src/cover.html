<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套「磁贴」：深色底、纯色方块、细字重大字号。秒数醒目；右下是正片里那组对比——往下翻一页，RDP 一句 14 字节，录像一帧 23 159 字节，
     两块磁贴面积按字节数画（FACTS G5、L2）。4:3 是重新排布，不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --bg: #1b1b1b; --fg: #f2f2f2; --dim: #a8a8a8; --rdp: #1b64c4; --rdpl: #9fd0ff; --vid: #5a5a5a; --you: #007a00; --fill: #b23d18; --glyph: #603cba; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--bg); color: var(--fg); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  .tile { position: absolute; color: var(--fg); overflow: hidden; }
  .tile .tl { position: absolute; left: 22px; top: 14px; font: 400 34px "Inter", "Sans SC"; }
  .tile .bn { position: absolute; left: 22px; bottom: 12px; font: 300 56px "Mono"; }
  .rdp { background: var(--rdp); } .vid { background: var(--vid); } .you { background: var(--you); } .fill { background: var(--fill); } .glyph { background: var(--glyph); }
  .name { font: 600 300px "Inter"; letter-spacing: -.03em; line-height: 1; }
  .sec { font: 200 250px "Inter"; letter-spacing: -.03em; line-height: 1; }
  .sec i { font: 300 84px "Inter", "Sans SC"; font-style: normal; margin-left: 18px; letter-spacing: 0; }
  .sub { font: 300 64px "Inter", "Sans SC"; }
  .note { font: 400 32px "Inter", "Sans SC"; color: var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <div class="tile rdp" id="big"><div class="tl"></div><div class="abs name">RDP</div></div>
  <div class="abs sec" id="sec"></div>
  <div class="abs sub" id="sub"></div>
  <div class="tile vid" id="vid"><div class="tl"></div><div class="bn"></div></div>
  <div class="tile rdp" id="cmd"></div>
  <div class="abs note" id="cmdl"></div>
  <div class="tile you" id="t1"><div class="tl"></div><div class="bn"></div></div>
  <div class="tile fill" id="t2"><div class="tl"></div><div class="bn"></div></div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const TX = {
    zh: { tl: '远程桌面协议', sec: '192<i>秒了解</i>', sub: 'Windows 远程的优雅实现', vid: '录像 · 翻一页', vb: '23 159 B', cmd: 'RDP · 14 B', t1: '诞生', t1b: '1998', t2: '端口', t2b: '3389' },
    en: { tl: 'Remote Desktop Protocol', sec: '192<i>seconds</i>', sub: 'Windows remoting, done elegantly', vid: 'Video · one scroll', vb: '23 159 B', cmd: 'RDP · 14 B', t1: 'Born', t1b: '1998', t2: 'Port', t2b: '3389' },
  }[lang];
  const $ = (id) => document.getElementById(id);
  const put = (id, x, y, w, h) => { const e = $(id); e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) { e.style.width = w + 'px'; e.style.height = h + 'px'; } };
  $('big').querySelector('.tl').textContent = TX.tl; $('sec').innerHTML = TX.sec; $('sub').textContent = TX.sub;
  $('vid').querySelector('.tl').textContent = TX.vid; $('vid').querySelector('.bn').textContent = TX.vb; $('cmdl').textContent = TX.cmd;
  $('t1').querySelector('.tl').textContent = TX.t1; $('t1').querySelector('.bn').textContent = TX.t1b;
  $('t2').querySelector('.tl').textContent = TX.t2; $('t2').querySelector('.bn').textContent = TX.t2b;
  // 面积按字节数：录像那一帧边长 S，RDP 那一句边长 S·√(14/23159)
  const S = wide ? 400 : 330, s14 = Math.max(10, Math.round(S * Math.sqrt(14 / 23159)));
  if (wide) {
    put('big', 90, 80, 780, 520); $('big').querySelector('.name').style.cssText = 'left:30px; top:170px';
    put('t1', 90, 616, 382, 150); put('t2', 488, 616, 382, 150);
    put('sec', 960, 70); put('sub', 970, 330);
    put('vid', 970, 470, S, S); put('cmd', 970 + S + 24, 470 + S - s14, s14, s14); put('cmdl', 970 + S + 24 + s14 + 16, 470 + S - 40);
  } else {
    put('big', 80, 70, 860, 470); $('big').querySelector('.name').style.cssText = 'left:30px; top:140px';
    put('t1', 960, 70, 560, 225); put('t2', 960, 315, 560, 225);
    put('sec', 80, 580); put('sub', 90, 840);
    put('vid', 960, 580, S, S); put('cmd', 960 + S + 24, 580 + S - s14, s14, s14); put('cmdl', 960 + S + 24 + s14 + 16, 580 + S - 40);
  }
  const sample = $('stage').textContent;
  Promise.all(['200', '300', '400', '600'].map((w) => document.fonts.load(w + ' 40px "Inter"', sample)).concat([document.fonts.load('300 40px "Sans SC"', sample), document.fonts.load('400 40px "Sans SC"', sample), document.fonts.load('300 40px "Mono"', sample)]))
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
