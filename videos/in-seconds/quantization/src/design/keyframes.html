<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>量化 · 关键帧</title>
<link rel="stylesheet" href="/css/base.css">
<script src="/js/data.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:"Sans SC","Inter",sans-serif;background:radial-gradient(1300px 760px at 32% 42%,#2A1466 0%,#0D0620 72%)}
#stage div{position:absolute;box-sizing:border-box;white-space:nowrap;line-height:1}
#stage svg{position:absolute;left:0;top:0}
.m{font-family:"Mono","Sans SC"}.n{font-family:"Inter","Sans SC";font-weight:300;letter-spacing:-1px}
</style></head><body><div id="stage"></div>
<script>
// 关键帧三张：?f=1|2|3。数字全部来自 data.js（由 research/lab 生成）。
// 设计从紫色出发：一个数的大小就是紫色的深浅（深靛 → 紫 → 粉白）。原版的色带是连续的，
// 量化以后只剩几种紫：4 位 16 种，2 位 4 种，1 位 2 种。观众看到的「色带变粗」就是量化本身。
const f = +new URLSearchParams(location.search).get('f') || 1, D = window.DATA, G = D.group, S = document.getElementById('stage');
const STOPS = [[0, [26, 11, 94]], [0.35, [91, 33, 214]], [0.6, [168, 85, 247]], [0.82, [232, 121, 249]], [1, [255, 227, 255]]];
const ramp = (u) => { u = Math.min(1, Math.max(0, u)); let i = 1; while (STOPS[i][0] < u) i++; const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], t = (u - a) / (b - a || 1); return `rgb(${ca.map((c, k) => Math.round(c + (cb[k] - c) * t)).join(',')})`; };
const smooth = (lo = 0, hi = 100) => `linear-gradient(90deg,${ramp(0)} 0%,` + STOPS.map(([u]) => `${ramp(u)} ${(lo + u * (hi - lo)).toFixed(2)}%`).join(',') + `,${ramp(1)} 100%)`;
const bands = (n) => n > 16 ? smooth() : 'linear-gradient(90deg,' + Array.from({ length: n }, (_, k) => `${ramp(k / (n - 1))} ${(k / n * 100).toFixed(3)}% ${((k + 1) / n * 100).toFixed(3)}%`).join(',') + ')';
const C = { dim: '#CDBDFF', w: '#FFFFFF', bad: '#FF6BB5', ink: '#1A0B5E', glow: '0 0 48px rgba(168,85,247,.55)' };
const box = (x, y, w, h, css, html = '', cls = '') => S.insertAdjacentHTML('beforeend', `<div class="${cls}" style="left:${x}px;top:${y}px;${w != null ? `width:${w}px;` : ''}${h != null ? `height:${h}px;` : ''}${css}">${html}</div>`);
const text = (x, y, size, html, css = '', cls = '') => box(x, y, null, null, `font-size:${size}px;${css}`, html, cls);
const CAP = { 1: '可它还有个 17 GB 的版本，做题的分数几乎一样', 2: '先定 16 个值，每个数换成最近的那个', 3: '让它少想一点，反而能对一成半', 4: '4 位的每说 100 个词，约有 5 个和原版不一样' };
const LEFT = { 1: 109, 2: 82, 3: 29, 4: 67 }, METER = { 1: ['17 GB', 'Qwen3.8 27B'], 2: ['4 位', '每个数 16 → 4'], 3: ['6.2 GB', '每个数 1 位'], 4: ['17 GB', '每个数 4 位'] };

// 常驻元素：字幕带、秒尺、剩余秒数、右上仪表（位置按系列约定）
text(60, 44, 44, LEFT[f], 'font-weight:500', 'm');
box(1460, 40, 400, null, 'text-align:right', `<span class="n" style="font-size:50px">${METER[f][0]}</span><br><span class="m" style="font-size:26px;line-height:1.6;color:${C.dim}">${METER[f][1]}</span>`);
box(0, 968, 1920, 112, 'background:rgba(8,3,20,.86);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:500', CAP[f]);
box(0, 962, 1920, 6, 'background:#2A1A55');
box(0, 962, 1920 * (120 - LEFT[f]) / 120, 6, `background:${smooth()}`);

if (f === 1) {                    // 开头：同一个模型的两个文件。原版的色带连续，小的那个只剩 16 种紫
  const x0 = 160, k = 24, line = x0 + 24 * k;
  text(160, 176, 44, 'Qwen3.8 27B', 'font-weight:600', 'm'); text(486, 188, 28, 'AI 模型', `color:${C.dim}`);
  box(1360, 222, 400, null, `text-align:right;font-size:28px;color:${C.dim}`, '同一份卷子 · 答对');
  [[55, '原版', '89.9%', 270, 65536], [17, '另一个版本', '90.4%', 560, 16]].forEach(([gb, name, score, y, n]) => {
    text(156, y, 104, gb + ' GB', '', 'n'); text(480, y + 62, 32, name, `color:${C.dim}`);
    box(1360, y + 8, 400, null, 'text-align:right;font-size:88px', score, 'n');
    box(x0, y + 126, gb * k, 84, `border-radius:42px;background:${bands(n)};box-shadow:${C.glow}`);
  });
  box(line, 396 - 4, 31 * k + 4, 92, 'background:rgba(13,6,32,.66);border-radius:0 46px 46px 0');   // 24 GB 之外的部分压暗：装不下
  box(line - 1.5, 372, 3, 440, `background:${C.w};box-shadow:0 0 18px rgba(255,255,255,.8)`);
  box(line - 150, 826, 300, null, 'text-align:center;font-size:32px;font-weight:600', '显卡 24 GB');
}

if (f === 2) {                    // 中段：文件里真实的 32 个数，每个换成 16 种紫里最近的一种
  const X = (u) => 240 + (u + 8) * 96, same = new Set(G.sameCode), d = G.d;
  text(160, 178, 26, `取自文件 · ${G.tensor} · 第 ${G.index} 组 · 32 个数`, `color:${C.dim}`, 'm');
  // 一个数怎么存：16 位 → 4 位（位串由数值算出：BF16 是 32 位浮点数的高 16 位）
  const v0 = G.values[2], c0 = G.codes[2], bits16 = ((new Uint32Array(new Float32Array([v0]).buffer)[0] + 0x8000) >>> 16).toString(2).padStart(16, '0'), bits4 = c0.toString(2).padStart(4, '0');
  text(160, 246, 48, v0.toFixed(6), '', 'n');
  [...bits16].forEach((b, i) => box(470 + i * 48, 236, 44, 60, `border:2px solid #6D4BD8;border-radius:10px;color:${C.dim};font-size:30px;display:flex;align-items:center;justify-content:center`, b, 'm'));
  text(470, 308, 26, '16 位', `color:${C.dim}`);
  text(1262, 246, 44, '→', `color:${C.dim}`);
  [...bits4].forEach((b, i) => box(1330 + i * 48, 236, 44, 60, `background:${ramp(c0 / 15)};border-radius:10px;color:${C.ink};font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center`, b, 'm'));
  text(1330, 308, 26, '4 位', `color:${C.dim}`);
  text(1545, 248, 40, `第 ${c0} 个`, 'font-weight:600');
  // 上：连续的色带，32 个数各在自己的位置；下：16 个值，16 种紫
  box(144, 404, 1584, 70, `border-radius:35px;background:${smooth(96 / 1584 * 100, 1536 / 1584 * 100)};box-shadow:${C.glow}`);
  for (let c = 0; c < 16; c++) {
    box(X(c - 8) - 46, 640, 92, 70, `border-radius:14px;background:${ramp(c / 15)};${c === 13 ? `outline:3px solid ${C.w};outline-offset:4px;box-shadow:0 0 30px rgba(255,255,255,.55)` : ''}`);
    box(X(c - 8) - 40, 728, 80, null, `text-align:center;font-size:26px;color:${c === 13 ? C.w : C.dim}`, c, 'm');
  }
  let lines = '';
  G.values.forEach((v, i) => {
    const hi = same.has(i), ox = X(v / d), oy = 419 + (i % 3) * 20, r = hi ? 12 : 9;
    lines += `<line x1="${ox}" y1="${oy + r}" x2="${X(G.codes[i] - 8)}" y2="640" stroke="#fff" stroke-width="${hi ? 3 : 1.5}" opacity="${hi ? 1 : 0.32}"/>`;
    box(ox - r, oy - r, 2 * r, 2 * r, `border:${hi ? 4 : 2.5}px solid ${C.w};border-radius:50%;${hi ? 'box-shadow:0 0 14px #fff' : 'opacity:.85'}`);
  });
  S.insertAdjacentHTML('afterbegin', `<svg width="1920" height="1080">${lines}</svg>`);
  box(1128, 358, 600, null, 'text-align:right;font-size:26px', [...same].map((i) => G.values[i]).sort().map((v) => v.toFixed(6)).join('&nbsp;&nbsp;'), 'm');
  box(X(5) - 120, 768, 240, null, 'text-align:center;font-size:30px;font-weight:600', G.decoded[2].toFixed(6), 'm');
  text(1744, 425, 28, '原来的数', `color:${C.dim}`); text(1744, 661, 28, '16 个值', `color:${C.dim}`);
}

if (f === 3) {                    // 结尾：五个版本并排。色带越短越粗，分数在右
  const TIER = ['原版', '8 位', '4 位', '2 位', '1 位'], bx = 420, bk = 11.5, tx = 1120, tk = 3.6, guess = tx + 25 * tk;
  // 每行一条线：竖线是少想（low）时的分数，圆点是多想（xhigh，缺省）时的分数。1 位那行圆点在竖线左边：想得久反而更差
  text(bx, 140, 28, '体积', `color:${C.dim}`); text(tx, 140, 28, '198 道选择题 · 答对　　│ 少想　● 多想', `color:${C.dim}`);
  box(guess - 1, 186, 0, 680, `border-left:2px dashed ${C.dim}`);
  box(guess - 120, 880, 240, null, `text-align:center;font-size:26px;color:${C.dim}`, '瞎蒙 25%');
  D.files.forEach((r, i) => {
    const y = 196 + i * 142, bad = r.score < 25, col = bad ? C.bad : C.w;
    text(118, y, 60, r.gb + ' GB', '', 'n'); text(122, y + 72, 26, `${TIER[i]} · ${r.name}`, `color:${C.dim}`);
    box(bx, y + 6, r.gb * bk, 60, `border-radius:30px;background:${bands(r.levels)};box-shadow:${C.glow}`);
    box(tx, y + 33, Math.max(r.score, r.low) * tk, 6, `background:${col};border-radius:3px`);
    box(tx + r.low * tk - 1.5, y + 20, 3, 32, `background:${col}`);
    box(tx + r.score * tk - 9, y + 27, 18, 18, `background:${col};border-radius:50%;box-shadow:0 0 16px ${col}`);
    box(1500, y - 2, 300, null, `text-align:right;font-size:72px;color:${col}`, r.score.toFixed(1) + '%', 'n');
  });
}
if (f === 4) {                    // 精度下降落到嘴上：同样说 100 个词，4 位的有约 5 个和原版选得不一样
  const q4 = D.files.find((r) => r.id === 'q4'), diff = Math.round(100 - q4.agree), x0 = 160, pitch = 16;
  const lit = new Set(Array.from({ length: diff }, (_, k) => Math.floor((k + 0.5) * 100 / diff)));
  text(160, 178, 26, `同一段话 · 同一个位置 · 各自选的下一个词（一致 ${q4.agree}%）`, `color:${C.dim}`, 'm');
  text(160, 286, 32, '原版', `color:${C.dim}`); text(160, 496, 32, '4 位 · ' + q4.name, `color:${C.dim}`);
  for (let i = 0; i < 100; i++) {
    box(x0 + i * pitch, 340, 10, 64, `border-radius:5px;background:${ramp(0.6)}`);
    if (lit.has(i)) box(x0 + i * pitch - 1, 540, 12, 84, `border-radius:6px;background:${C.w};box-shadow:0 0 18px #fff`);
    else box(x0 + i * pitch, 550, 10, 64, `border-radius:5px;background:${ramp(0.6)}`);
  }
  text(156, 700, 120, diff, '', 'n'); text(250, 742, 56, '/ 100', `color:${C.dim}`, 'n');
  text(440, 756, 36, '个词和原版不一样', `color:${C.dim}`);
}
document.body.dataset.ready = '1';
</script></body></html>
