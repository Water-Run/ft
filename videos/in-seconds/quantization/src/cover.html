<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套视觉：平的近黑紫底；数据砖（紫色深浅是数的大小），从左到右一列比一列粗——16 位、8 位、4 位、2 位、1 位，
     看到色阶就是看到量化。不用渐变光斑、外发光。秒数醒目（系列约定）。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #0D0620; --paper: #FFFFFF; --dim: #CDBDFF; --dimp: #8A7BB5; }
  html, body { margin: 0; overflow: hidden; background: var(--ink); }
  body { font-family: "Sans SC", "Inter"; color: var(--paper); }
  #bg { position: absolute; inset: 0; background: var(--ink); }
  .abs { position: absolute; white-space: nowrap; }
  .sec { font: 200 250px/1 "Inter"; letter-spacing: -10px; }
  .sec-u { font: 800 84px/1 "Sans SC"; color: var(--dim); }
  .ttl { font: 900 300px/1 "Sans SC"; letter-spacing: -8px; }
  .sub { font: 800 62px/1.1 "Sans SC"; }
  .lbl { font: 600 30px/1 "Mono"; color: var(--dim); text-align: center; }
  .tile { position: absolute; border-radius: 8px; overflow: hidden; }
  .tile img { display: block; width: 100%; height: 100%; }

  .r43 #stage { width: 1600px; height: 1200px; }
  .r169 .sec { left: 110px; top: 96px; }
  .r169 .sec-u { left: 560px; top: 220px; }
  .r169 .ttl { left: 100px; top: 380px; }
  .r169 .sub { left: 116px; top: 714px; }
  .r43 .sec { left: 100px; top: 90px; font-size: 220px; }
  .r43 .sec-u { left: 500px; top: 196px; font-size: 76px; }
  .r43 .ttl { left: 92px; top: 330px; font-size: 270px; }
  .r43 .sub { left: 106px; top: 630px; font-size: 56px; }
</style>
</head>
<body class="r169">
<div id="stage">
<div id="bg"></div>
<div id="cover">
  <div class="abs sec">120</div>
  <div class="abs sec-u">秒了解</div>
  <div class="abs ttl">量化</div>
  <div class="abs sub">让模型变小的方式和代价</div>
  <div id="wall"></div>
</div>
</div>
<script>
  // 只用到正片 quant.js 的纹理：这里给它补上最小的 DOM 小工具（正片里由 engine.js 提供）
  const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
  const css = (e, o) => { Object.assign(e.style, o); return e; };
  const px = (e, x, y, w, hh) => css(e, { left: x + 'px', top: y + 'px', ...(w != null ? { width: w + 'px' } : {}), ...(hh != null ? { height: hh + 'px' } : {}) });
</script>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/quant.js"></script>
<script>
  // 版式由 ?r= 决定：169 或 43；语言目前只有中文
  const r = new URLSearchParams(location.search).get('r') || '169';
  document.body.className = r === '43' ? 'r43' : 'r169';
  // 砖墙：5 列 × 4 行，同一片数据，从左到右各列能取的值越来越少（65536、256、16、4、2），列下标注位数
  const wall = document.getElementById('wall');
  const WL = r === '43'
    ? { x: 860, y: 140, size: 120, pitch: 134, rows: 4, lx: 0, ly: 4 * 134 + 16 }
    : { x: 1170, y: 150, size: 116, pitch: 130, rows: 5, lx: 0, ly: 5 * 130 + 18 };
  const LEVELS = [65536, 256, 16, 4, 2], BITS = ['16', '8', '4', '2', '1'];
  if (r === '43') { WL.x = 100; WL.y = 760; WL.size = 96; WL.pitch = 108; WL.rows = 2; WL.ly = 2 * 108 + 14; }
  const cols = r === '43' ? 10 : 5;
  for (let c = 0; c < cols; c++) {
    const lv = LEVELS[Math.floor(c * 5 / cols)];
    for (let k = 0; k < WL.rows; k++) {
      const e = QZ.tile(wall, WL.x + c * WL.pitch, WL.y + k * WL.pitch, WL.size, 500 + k * 10, lv);   // 同一行用同一片数据：各列唯一的差别是精度
      e.style.zIndex = 1;
    }
    if (r !== '43' || c % 2 === 0) {
      const w = r === '43' ? 2 * WL.pitch - (WL.pitch - WL.size) : WL.size;
      const t = h('div', 'abs lbl', wall, BITS[Math.floor(c * 5 / cols)] + ' 位'); px(t, WL.x + c * WL.pitch, WL.y + WL.ly, w);
    }
  }
  Promise.all(window.PENDING || []).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
