<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套颜色：墨紫底，色带表示数的大小（紫色越深越小），白色只给字与线。
     底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #0D0620; --deep: #1A0B5E; --bright: #FFE3FF; --paper: #FFFFFF; --dim: #CDBDFF; --dimp: #8A7BB5; --ac: #A855F7; --bad: #FF6BB5; }
  html, body { margin: 0; overflow: hidden; background: var(--ink); }
  body { font-family: "Sans SC", "Inter"; color: var(--paper); }
  #bg { position: absolute; inset: 0; background: radial-gradient(1300px 760px at 32% 42%, #2A1466 0%, #0D0620 72%); }
  .abs { position: absolute; white-space: nowrap; }
  .num { font-family: "Inter", "Sans SC"; font-weight: 300; letter-spacing: -4px; line-height: 1; }
  .ttl { font-weight: 900; letter-spacing: -3px; line-height: 1.05; }
  .sub { font-weight: 700; color: var(--dim); }
  .bar { position: absolute; border-radius: 40px; }
  .grad { background: linear-gradient(90deg, #1A0B5E 0%, #1A0B5E 0.1%, #5B21D6 35%, #A855F7 60%, #E879F9 82%, #FFE3FF 100%); box-shadow: 0 0 60px #A855F7; }
  .line { position: absolute; width: 4px; background: var(--paper); box-shadow: 0 0 18px #FFFFFF; }
  .lbl { font: 500 36px/1 "Sans SC", "Inter"; color: var(--dim); }
  .mono { font-family: "Mono", "Sans SC"; }

  /* ?r=169：16:9 */
  .r169 .sec { left: 120px; top: 120px; font-size: 300px; }
  .r169 .sec-u { left: 500px; top: 230px; font-size: 90px; font-weight: 800; color: var(--dim); }
  .r169 .ttl { left: 120px; top: 400px; font-size: 150px; }
  .r169 .sub { left: 124px; top: 600px; font-size: 56px; }
  .r169 .bar-a { left: 120px; top: 720px; width: 1320px; height: 44px; }
  .r169 .bar-b { left: 120px; top: 790px; width: 408px; height: 44px; }
  .r169 .line { left: 696px; top: 690px; height: 190px; }
  .r169 .gpu { left: 712px; top: 846px; font-size: 36px; color: var(--paper); }
  .r169 .mono-tag { left: 120px; top: 884px; }
  .r169 .bad { left: 1220px; top: 720px; width: 0; }

  /* ?r=43：4:3，上下重排，不是裁切 */
  .r43 .sec { left: 100px; top: 110px; font-size: 260px; }
  .r43 .sec-u { left: 430px; top: 200px; font-size: 80px; font-weight: 800; color: var(--dim); }
  .r43 .ttl { left: 100px; top: 360px; font-size: 128px; }
  .r43 .sub { left: 104px; top: 520px; font-size: 48px; }
  .r43 .bar-a { left: 100px; top: 700px; width: 1000px; height: 42px; }
  .r43 .bar-b { left: 100px; top: 764px; width: 310px; height: 42px; }
  .r43 .line { left: 527px; top: 680px; height: 170px; }
  .r43 .gpu { left: 540px; top: 828px; font-size: 32px; color: var(--paper); }
  .r43 .mono-tag { left: 100px; top: 1000px; }
  .r43 .bad { display: none; }
</style>
</head>
<body class="r169">
<div id="bg"></div>
<div id="cover">
  <div class="abs num sec">120</div>
  <div class="abs num sec-u">秒</div>
  <div class="abs ttl">了解量化</div>
  <div class="abs sub">让模型变小的方式和代价</div>
  <div class="bar bar-a grad"></div>
  <div class="bar bar-b" id="bandsbar"></div>
  <div class="line"></div>
  <div class="abs gpu">显卡 24 GB</div>
  <div class="abs lbl mono mono-tag">55 GB → 17 GB</div>
</div>
<script>
  // 版式由 ?r= 决定：169 或 43；语言目前只有中文
  const r = new URLSearchParams(location.search).get('r') || '169';
  document.body.className = r === '43' ? 'r43' : 'r169';
  // 16 段色带：与正片的 quant.js 同一套色标（颜色由色标算出，不在这里写死）
  const STOPS = [[0, [26, 11, 94]], [0.35, [91, 33, 214]], [0.6, [168, 85, 247]], [0.82, [232, 121, 249]], [1, [255, 227, 255]]];
  const ramp = (u) => { let i = 1; while (i < STOPS.length - 1 && STOPS[i][0] < u) i++; const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], k = (u - a) / (b - a || 1); return '#' + ca.map((c, j) => Math.round(c + (cb[j] - c) * k).toString(16).padStart(2, '0')).join('').toUpperCase(); };
  const parts = []; for (let k = 0; k < 16; k++) { const c = ramp(k / 15); parts.push(c + ' ' + (k / 16 * 100) + '%', c + ' ' + ((k + 1) / 16 * 100) + '%'); }
  document.getElementById('bandsbar').style.background = 'linear-gradient(90deg,' + parts.join(',') + ')';
  document.getElementById('bandsbar').style.boxShadow = '0 0 60px #A855F7';
  document.body.dataset.ready = '1';
</script>
</body>
</html>
