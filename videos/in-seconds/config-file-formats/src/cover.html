<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套构成主义海报：米色纸底、一道红色大斜板、黑底上的一份配置文件（红字是数据），五个格式名逐个放大、斜排、出画。
     4:3 是重新排布，不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #1B1816; --paper: #E9E0CC; --ac: #D4291F; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--paper); color: var(--ink); font-family: "Inter", "Sans SC"; overflow: hidden; position: relative; }
  .abs { position: absolute; white-space: nowrap; }
  svg.abs { overflow: visible; }
  .names { font: 900 100px "Inter"; letter-spacing: -.04em; line-height: .86; transform-origin: 0 100%; }
  .names div:nth-child(odd) { color: var(--ink); }
  .names div:nth-child(even) { color: var(--ac); }
  .doc { background: var(--ink); color: var(--paper); font: 800 40px "Mono"; line-height: 1.38; padding: 34px 44px; white-space: pre; }
  .doc .d { color: #F0553F; }
  .doc .p { color: #B9B0A0; }
  .tag { background: var(--ink); color: var(--paper); display: flex; align-items: baseline; padding: 8px 30px 16px; }
  .tag b { font: 800 150px "Mono"; letter-spacing: -.03em; line-height: 1; color: #F0553F; }
  .tag i { font: 900 84px "Sans SC"; font-style: normal; margin-left: 14px; line-height: 1; }
  .ttl { font: 900 92px "Sans SC"; line-height: 1.12; letter-spacing: -.01em; }
  /* 16:9 */
  .r169 .names { left: 70px; top: 120px; transform: rotate(-8deg); }
  .r169 .doc { left: 1180px; top: 70px; }
  .r169 .tag { left: 1180px; top: 560px; }
  .r169 .ttl { left: 90px; top: 690px; }
  /* 4:3 */
  .r43 .names { left: 60px; top: 90px; transform: rotate(-8deg); }
  .r43 .doc { left: 940px; top: 120px; font-size: 36px; }
  .r43 .tag { left: 940px; top: 560px; }
  .r43 .ttl { left: 80px; top: 780px; font-size: 96px; }
</style>
</head>
<body>
<div id="stage">
  <svg class="abs" id="slab" width="100%" height="100%"></svg>
  <div class="abs names"></div>
  <div class="abs doc"></div>
  <div class="abs tag"><b>150</b><i>秒</i></div>
  <div class="abs ttl">认识五大主流<br>配置文件</div>
</div>
<script>
  const q = new URLSearchParams(location.search), wide = q.get('r') !== '43';
  document.documentElement.className = wide ? 'r169' : 'r43';
  const W = wide ? 1920 : 1600, H = wide ? 1080 : 1200;
  // 一道红色大斜板，从左下切到右上
  document.getElementById('slab').innerHTML = `<polygon points="0,${H * 0.48} ${W},${H * 0.08} ${W},${H * 0.22} 0,${H * 0.62}" fill="#D4291F"/>`;
  // 五个格式名：一个比一个大
  const names = document.querySelector('.names');
  ['.ini', '.xml', '.json', '.yaml', '.toml'].forEach((n, i) => { const d = document.createElement('div'); d.textContent = n; d.style.fontSize = Math.round((wide ? 96 : 92) * Math.pow(1.13, i)) + 'px'; names.appendChild(d); });
  // 同一份配置（片中主画面的 TOML 写法）
  const P = (s) => `<span class="p">${s}</span>`, D = (s) => `<span class="d">${s}</span>`;
  document.querySelector('.doc').innerHTML = [`${P('[')}server${P(']')}`, `host ${P('=')} ${D('"localhost"')}`, `port ${P('=')} ${D('8080')}`, '', `${P('[')}server${P('.')}db${P(']')}`, `user ${P('=')} ${D('"app"')}`, `port ${P('=')} ${D('5432')}`].join('\n');
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('800 40px "Mono"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
