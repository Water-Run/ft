<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 保留（本片只有中文）。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套颜色与字体，单独排版：墨绿黑底，纸色的大字 TTFT 后面跟一块琥珀光标；底部是一条请求的时间轨迹（取自正片「路程」一场），琥珀色的一段就是 TTFT。
     4:3 是重新排布（字更大、轨迹下移），不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #0b1210; --ink2: #16211d; --paper: #ece8dc; --ac: #ffb000; --dim: #8e9a94; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--ink); color: var(--paper); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  .tag { background: var(--ac); color: var(--ink); display: flex; align-items: baseline; padding: 6px 30px 14px; }
  .tag b { font: 800 150px "Mono"; letter-spacing: -.03em; line-height: 1; }
  .tag i { font: 900 84px "Inter", "Sans SC"; font-style: normal; margin-left: 14px; line-height: 1; }
  .lead { font: 900 96px "Inter", "Sans SC"; line-height: 1; }
  .big { font: 900 500px "Inter"; letter-spacing: -.02em; line-height: .9; }
  .caret { background: var(--ac); }
  .sub { font: 900 84px "Inter", "Sans SC"; line-height: 1; }
  .seg { position: absolute; }
  .net { background: var(--dim); } .pre { background: var(--paper); } .gen { background: var(--ac); } .more { background: var(--ink2); }
  svg { position: absolute; overflow: hidden; }
  /* 16:9 */
  .r169 .tag { left: 100px; top: 84px; }
  .r169 .lead { left: 520px; top: 120px; }
  .r169 .big { left: 84px; top: 220px; }
  .r169 .caret { left: 1370px; top: 258px; width: 96px; height: 380px; }
  .r169 .sub { left: 100px; top: 800px; }
  /* 4:3 */
  .r43 .tag { left: 80px; top: 90px; }
  .r43 .lead { left: 500px; top: 126px; }
  .r43 .big { left: 64px; top: 250px; font-size: 440px; }
  .r43 .caret { left: 1196px; top: 284px; width: 84px; height: 336px; }
  .r43 .sub { left: 80px; top: 880px; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs tag"><b>96</b><i>秒</i></div>
  <div class="abs lead">了解</div>
  <div class="abs big">TTFT</div>
  <div class="abs caret"></div>
  <div class="abs sub">首 Token 延迟</div>
</div>
<script>
  const q = new URLSearchParams(location.search), wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' zh';
  const st = document.getElementById('stage');
  // 轨迹：5 秒的一次请求，网络 0.2、排队 1.0、处理输入 0.4、生成首段 0.2、网络 0.2，之后继续生成 3.0；琥珀色是收到第一段的那一段
  const x0 = wide ? 100 : 80, W = wide ? 1720 : 1440, y = wide ? 668 : 740, h = wide ? 104 : 96, sc = W / 5;
  let x = x0;
  for (const [k, d] of [['net', .2], ['que', 1.0], ['pre', .4], ['gen', .2], ['net', .2], ['more', 3.0]]) {
    const w = Math.round(d * sc), e = document.createElement('div'); e.className = 'seg ' + (k === 'que' ? 'more' : k);
    e.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; st.appendChild(e);
    if (k === 'que') { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', w); s.setAttribute('height', h); s.style.cssText = `left:${x}px;top:${y}px`; for (let d2 = -h; d2 < w; d2 += 18) { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); l.setAttribute('x1', d2); l.setAttribute('y1', h); l.setAttribute('x2', d2 + h); l.setAttribute('y2', 0); l.setAttribute('stroke', '#ece8dc'); l.setAttribute('stroke-width', 5); s.appendChild(l); } st.appendChild(s); }
    x += w;
  }
  // 琥珀括号：发出请求 → 收到第一段（2 秒）
  const br = document.createElement('div'); br.style.cssText = `position:absolute;left:${x0}px;top:${y - 32}px;width:${Math.round(2 * sc)}px;height:6px;background:#ffb000`; st.appendChild(br);
  for (const bx of [0, Math.round(2 * sc) - 6]) { const t = document.createElement('div'); t.style.cssText = `position:absolute;left:${x0 + bx}px;top:${y - 32}px;width:6px;height:24px;background:#ffb000`; st.appendChild(t); }
  const sample = st.textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('800 40px "Mono"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
