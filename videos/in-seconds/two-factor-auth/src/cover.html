<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套颜色与字体，单独排版：墨色一侧是片名，纸色一侧是 30 秒表盘与一个验证码（取自正片第 3 个时间步的真实结果）。
     4:3 是重新排布（上墨下纸），不是裁切。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #0c0d0f; --paper: #f2efe8; --ac: #ff4a1c; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--ink); color: var(--paper); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  .paper { background: var(--paper); }
  .big { font: 900 440px "Inter"; letter-spacing: -.04em; line-height: 1; }
  .tag { background: var(--ac); color: var(--ink); display: flex; align-items: baseline; padding: 6px 34px 16px; }
  .tag b { font: 800 170px "Mono"; letter-spacing: -.03em; line-height: 1; }
  .tag i { font: 900 96px "Inter", "Sans SC"; font-style: normal; margin-left: 18px; line-height: 1; }
  .ttl { font: 900 76px "Inter", "Sans SC"; line-height: 1.16; letter-spacing: -.01em; }
  .en .ttl { font-size: 80px; }
  .kick { font: 700 40px "Inter", "Sans SC"; color: var(--ink); }
  .code { font: 800 150px "Mono"; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
  svg { position: absolute; overflow: visible; }
  /* 16:9：左墨右纸 */
  .r169 .paper { left: 1090px; top: 0; width: 830px; height: 1080px; }
  .r169 .big { left: 84px; top: 52px; }
  .r169 .tag { left: 100px; top: 492px; }
  .r169 .ttl { left: 100px; top: 722px; }
  .r169 .kick { left: 1150px; top: 64px; }
  .r169 .code { left: 1212px; top: 716px; }
  /* 4:3：上墨下纸 */
  .r43 .paper { left: 0; top: 770px; width: 1600px; height: 430px; }
  .r43 .big { left: 66px; top: 60px; font-size: 470px; }
  .r43 .tag { left: 1090px; top: 120px; }
  .r43 .tag b { font-size: 150px; }
  .r43 .tag i { font-size: 84px; }
  .r43 .ttl { left: 84px; top: 548px; font-size: 80px; }
  .r43 .kick { left: 1090px; top: 388px; color: var(--paper); }
  .r43 .code { left: 80px; top: 824px; font-size: 168px; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs paper"></div>
  <div class="abs big">2FA</div>
  <div class="abs tag"><b>120</b><i></i></div>
  <div class="abs ttl"></div>
  <div class="abs kick"></div>
  <div class="abs code">685 976</div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const TEXT = {
    zh: { unit: '秒', title: '什么是 2FA，<br>以及它是怎么工作的', kick: 'XX 秒速通' },
    en: { unit: 's', title: 'What 2FA is,<br>and how it works', kick: 'In XX Seconds' },
  }[lang];
  document.querySelector('.tag i').textContent = TEXT.unit;
  document.querySelector('.ttl').innerHTML = TEXT.title;
  document.querySelector('.kick').textContent = TEXT.kick;
  // 30 秒表盘：指针停在第 7 秒，走过的刻度是朱红
  const NS = 'http://www.w3.org/2000/svg', INK = '#0c0d0f', AC = '#ff4a1c';
  const [cx, cy, r] = wide ? [1505, 390, 262] : [1330, 986, 166], sec = 7;
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', 10); s.setAttribute('height', 10); s.style.left = cx + 'px'; s.style.top = cy + 'px';
  const line = (x1, y1, x2, y2, c, w) => { const e = document.createElementNS(NS, 'line'); for (const [k, v] of Object.entries({ x1, y1, x2, y2, stroke: c, 'stroke-width': w })) e.setAttribute(k, v); s.appendChild(e); };
  for (let i = 0; i < 30; i++) { const a = i * Math.PI / 15, big = i % 5 === 0, r0 = r * (big ? 0.8 : 0.89); line(r0 * Math.sin(a), -r0 * Math.cos(a), r * Math.sin(a), -r * Math.cos(a), i >= 1 && i <= sec ? AC : INK, big ? r * 0.04 : r * 0.022); }
  const a = sec * Math.PI / 15; line(-0.2 * r * Math.sin(a), 0.2 * r * Math.cos(a), 1.08 * r * Math.sin(a), -1.08 * r * Math.cos(a), AC, r * 0.034);
  const hub = document.createElementNS(NS, 'rect'); for (const [k, v] of Object.entries({ x: -r * 0.05, y: -r * 0.05, width: r * 0.1, height: r * 0.1, fill: AC })) hub.setAttribute(k, v); s.appendChild(hub);
  document.getElementById('stage').appendChild(s);
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('700 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('700 40px "Inter"', sample), document.fonts.load('800 40px "Mono"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
