<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* 投稿封面：?r=169 → 1920×1080，?r=43 → 1600×1200；?lang= 切换语言。kit/tools/covers.js 按 2 倍像素出图。
     与正片同一套颜色、字体与图形语言（包豪斯）：红圆 = 你知道的，蓝方 = 你拥有的，黄三角 = 你本身，黑框 = 服务器。
     16:9 左边是三块形状和一只黑框，右边是标题；4:3 上形状、下标题，重新排布，不是裁切。
     右下角压一行正片里的真实协议文本（RFC 6265 的示例 Cookie）。底部约 15% 不放文字：投稿平台会在那里叠时长与标题。 */
  :root { --ink: #111111; --paper: #F1ECE1; --red: #E2412C; --yel: #F2C230; --blue: #2F57B0; --dim: #6E6A61; }
  html, body, #stage { width: var(--W); height: var(--H); }
  .r169 { --W: 1920px; --H: 1080px; }
  .r43 { --W: 1600px; --H: 1200px; }
  #stage { background: var(--paper); color: var(--ink); font-family: "Inter", "Sans SC"; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  svg.abs { overflow: visible; }
  .n { font: 800 170px "Mono"; letter-spacing: -.03em; line-height: 1; }
  .n i { font: 900 84px "Sans SC", "Inter"; font-style: normal; margin-left: 14px; letter-spacing: 0; }
  .en .n i { font-family: "Inter"; }
  .big { font: 900 196px "Inter", "Sans SC"; letter-spacing: -.045em; line-height: .95; }
  .en .big { font-size: 160px; }
  .sub { font: 900 88px "Sans SC", "Inter"; letter-spacing: -.01em; line-height: 1.1; }
  .en .sub { font: 900 62px "Inter"; line-height: 1.12; }
  .kick { font: 700 34px "Sans SC", "Inter"; color: var(--dim); }
  .code { font: 700 30px "Mono"; color: var(--paper); background: var(--blue); padding: 10px 18px; }
  /* 16:9 */
  .r169 .n { left: 1040px; top: 96px; }
  .r169 .big { left: 1032px; top: 300px; }
  .r169 .sub { left: 1040px; top: 540px; }
  .r169 .kick { left: 1044px; top: 54px; }
  .r169 .code { left: 1040px; top: 790px; }
  .en.r169 .sub { top: 510px; }
  /* 4:3 */
  .r43 .n { left: 800px; top: 96px; font-size: 150px; }
  .r43 .kick { left: 806px; top: 52px; }
  .r43 .code { left: 800px; top: 300px; }
  .r43 .big { left: 70px; top: 630px; font-size: 200px; }
  .en.r43 .big { font-size: 176px; }
  .r43 .sub { left: 76px; top: 866px; font-size: 92px; }
  .en.r43 .sub { font-size: 60px; top: 846px; }
</style>
</head>
<body>
<div id="stage">
  <svg class="abs" id="shapes" width="10" height="10"></svg>
  <div class="abs kick"></div>
  <div class="abs n"><span></span><i></i></div>
  <div class="abs big"></div>
  <div class="abs sub"></div>
  <div class="abs code">Cookie: SID=31d4d96e407aad42</div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') || 'zh', wide = q.get('r') !== '43';
  document.documentElement.className = (wide ? 'r169' : 'r43') + ' ' + lang;
  const TEXT = {
    zh: { n: '200', unit: '秒', big: 'Web 登录', sub: wide ? '怎么验证<br>你是你' : '怎么验证你是你', kick: 'XX 秒速通' },
    en: { n: '200', unit: 's', big: 'Web Login', sub: 'How a site checks<br>that you are you', kick: 'In XX Seconds' },
  }[lang];
  document.querySelector('.n span').textContent = TEXT.n; document.querySelector('.n i').textContent = TEXT.unit;
  document.querySelector('.big').textContent = TEXT.big; document.querySelector('.sub').innerHTML = TEXT.sub;
  document.querySelector('.kick').textContent = TEXT.kick;
  // 形状：红圆（知道）、蓝方（拥有）、黄三角（本身）拼在一起；一只黑框（服务器）只框住它们的一角：服务器看到的只是你出示的那一部分
  const NS = 'http://www.w3.org/2000/svg', s = document.getElementById('shapes');
  const add = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; };
  const [ox, oy, k] = wide ? [70, 110, 1] : [70, 40, 0.68];
  const P = (x, y) => `${ox + x * k},${oy + y * k}`;
  add('circle', { cx: ox + 330 * k, cy: oy + 330 * k, r: 300 * k, fill: '#E2412C' });
  add('rect', { x: ox + 470 * k, y: oy + 420 * k, width: 360 * k, height: 360 * k, fill: '#2F57B0' });
  add('polygon', { points: [P(600, 40), P(900, 560), P(300, 560)].join(' '), fill: '#F2C230' });
  add('rect', { x: ox + 520 * k, y: oy + 150 * k, width: 400 * k, height: 400 * k, fill: 'none', stroke: '#111111', 'stroke-width': 28 * k });
  const sample = document.getElementById('stage').textContent;
  Promise.all([document.fonts.load('900 40px "Sans SC"', sample), document.fonts.load('700 40px "Sans SC"', sample), document.fonts.load('900 40px "Inter"', sample), document.fonts.load('700 40px "Inter"', sample), document.fonts.load('800 40px "Mono"', sample), document.fonts.load('700 40px "Mono"', sample)])
    .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
